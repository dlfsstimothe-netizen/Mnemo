<style>
/* Layout: une colonne de 720px ; bandeau violet en tête avec le niveau, puis services, calendrier et badges, chaque bloc avec sa couleur d'icône ronde. */
:root{
  --bg:#ECEEFC; --surface:#FFFFFF; --surface-2:#E4E7FA; --ink:#171A3C; --ink-2:#565B80; --line:#D3D8F2;
  --accent:#4F3FE0; --accent-ink:#FFFFFF; --accent-soft:#E2DFFF;
  --mark:#FFE98A; --mark-ink:#171A3C;
  --good:#12805C; --good-soft:#D5F1E5; --bad:#C23A3A; --bad-soft:#F9DCDC; --warn:#9A5A08; --warn-soft:#FBEBCF;
  --c1:#5B3FE0; --c1s:#E6E1FF; --c2:#CF3F29; --c2s:#FFE3DC; --c3:#0E8F82; --c3s:#D3F3EE;
  --c4:#B87400; --c4s:#FFEBC4; --c5:#C42A86; --c5s:#FFDDF0; --c6:#2467D1; --c6s:#DCE9FF;
  --band-a:#3B2DBD; --band-b:#6A3FE6;
  --f-display:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1030; --surface:#1A1C47; --surface-2:#252858; --ink:#EEF0FF; --ink-2:#A5AAD6; --line:#313566;
  --accent:#9A8CFF; --accent-ink:#0F1030; --accent-soft:#2D2D70; --mark:#5E4E12; --mark-ink:#EEF0FF;
  --good:#4FD1A0; --good-soft:#133A2D; --bad:#FF8A8A; --bad-soft:#431C24; --warn:#E3A44F; --warn-soft:#3F2E12;
  --c1:#A996FF; --c1s:#312C78; --c2:#FF9078; --c2s:#4D2A33; --c3:#3DD9C5; --c3s:#134A48;
  --c4:#FFC247; --c4s:#4F3A12; --c5:#FF7CC4; --c5s:#4D1F3E; --c6:#76B2FF; --c6s:#1B3A66;
  --band-a:#2A1F94; --band-b:#5230C4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1030; --surface:#1A1C47; --surface-2:#252858; --ink:#EEF0FF; --ink-2:#A5AAD6; --line:#313566;
  --accent:#9A8CFF; --accent-ink:#0F1030; --accent-soft:#2D2D70; --mark:#5E4E12; --mark-ink:#EEF0FF;
  --good:#4FD1A0; --good-soft:#133A2D; --bad:#FF8A8A; --bad-soft:#431C24; --warn:#E3A44F; --warn-soft:#3F2E12;
  --c1:#A996FF; --c1s:#312C78; --c2:#FF9078; --c2s:#4D2A33; --c3:#3DD9C5; --c3s:#134A48;
  --c4:#FFC247; --c4s:#4F3A12; --c5:#FF7CC4; --c5s:#4D1F3E; --c6:#76B2FF; --c6s:#1B3A66;
  --band-a:#2A1F94; --band-b:#5230C4; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);padding-inline:16px;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.app{max-width:720px;margin:0 auto;padding-block:20px 24px;display:flex;flex-direction:column;gap:20px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.top-r{display:flex;align-items:center;gap:8px;min-width:0}
.brand{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:6px 0;cursor:pointer;font:800 21px/1 var(--f-display);letter-spacing:-.02em;color:var(--ink)}
.logo svg{display:block}
.mark{color:var(--accent)}
.sync{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--f-mono);color:var(--ink-2);white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-2)}
.sync.s-cloud::before{background:var(--good)}
.sync.s-ro::before,.sync.s-local::before{background:var(--warn)}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.h1{font:800 clamp(28px,6vw,38px)/1.08 var(--f-display);letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.h2{font:700 19px/1.2 var(--f-display);letter-spacing:-.01em}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:20px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-align:center}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;cursor:pointer;text-align:left}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(23,26,60,.05)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.item:last-child{border-bottom:0}
button.item:hover{background:var(--surface-2)}
.item .t{font-weight:600;overflow-wrap:anywhere}
.dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--fc,var(--c6))}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;background:var(--surface-2);font:500 12px var(--f-mono);color:var(--ink-2);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);border-radius:99px}

.hero{display:flex;flex-direction:column;gap:16px}
.hero-n{display:flex;align-items:flex-end;gap:16px}
.big{font:800 clamp(72px,22vw,112px)/.85 var(--f-display);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.hero-n p{padding-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{min-width:0}
.stats b{display:block;font:500 22px var(--f-mono);font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:112px}
.wd{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.wd .v{font:500 12px var(--f-mono);color:var(--ink-2)}
.wd .b{width:100%;max-width:36px;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:3px}
.wd .b.z{background:var(--surface-2)}
.wd .l{font:500 11px var(--f-mono);color:var(--ink-2);text-transform:uppercase}
.wd.today .l{color:var(--ink);font-weight:500}

label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label.f small{font-weight:400;color:var(--ink-2)}
input[type=text],input[type=search],input[type=email],input[type=password],input[type=date],select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
textarea{resize:vertical;line-height:1.5}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:inline-flex}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.opt span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;font-size:14px}
.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.drop{display:flex;align-items:center;justify-content:center;min-height:56px;border:1.5px dashed var(--line);border-radius:12px;color:var(--ink-2);font-weight:600;cursor:pointer;text-align:center;padding:10px}
.drop:hover{border-color:var(--accent);color:var(--accent)}
.err{color:var(--bad);font-size:14px;font-weight:600}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px}

.qhead{display:flex;align-items:center;gap:12px}
.qprog{flex:1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,30px);display:flex;flex-direction:column;gap:20px;box-shadow:0 1px 0 var(--line),0 12px 28px -18px rgba(20,27,46,.35)}
.qtext{font:600 clamp(21px,4.6vw,27px)/1.3 var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.choice{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;min-height:52px}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice b{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--surface-2);font:500 13px var(--f-mono)}
.choice span{padding-top:2px;overflow-wrap:anywhere}
.choice.ok{border-color:var(--good);background:var(--good-soft)}
.choice.ok b{background:var(--good);color:var(--bg)}
.choice.ko{border-color:var(--bad);background:var(--bad-soft)}
.choice.ko b{background:var(--bad);color:var(--bg)}
.choice.dim{opacity:.55}
.choice:disabled{cursor:default}
.answer{border-radius:12px;background:var(--surface-2);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.answer .mk{background:linear-gradient(transparent 50%,var(--mark) 50%);color:var(--ink);display:inline;padding-inline:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.answer .lbl{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px;padding:8px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.rate button small{font:500 11px var(--f-mono);color:var(--ink-2)}
.rate button:hover{border-color:var(--ink)}
.rate .g0{color:var(--bad)}.rate .g3{color:var(--good)}
.verdict{font:700 18px var(--f-display)}
.verdict.ok{color:var(--good)}.verdict.ko{color:var(--bad)}
.kbd{font:500 12px var(--f-mono);color:var(--ink-2)}
.spin{display:inline-block;width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
details summary{cursor:pointer;font-weight:600}
.txt{max-height:240px;overflow:auto;white-space:pre-wrap;font-size:14px;color:var(--ink-2);margin-top:10px;overflow-wrap:anywhere}
.cardrow{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line)}
.cardrow:last-child{border-bottom:0}
.cardrow .q{overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;max-width:720px;margin:0 auto;padding-bottom:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 8px;font-size:14px;border:0;border-radius:12px;background:none;color:var(--ink-2);font-weight:600;cursor:pointer;white-space:nowrap}
.tabs svg{flex:none}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.ico{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--ics,var(--accent-soft));color:var(--ic,var(--accent))}
.ico svg{display:block}
.ico.lg{width:56px;height:56px}
.ico.sm{width:34px;height:34px}
.i1{--ic:var(--c1);--ics:var(--c1s)}.i2{--ic:var(--c2);--ics:var(--c2s)}.i3{--ic:var(--c3);--ics:var(--c3s)}
.i4{--ic:var(--c4);--ics:var(--c4s)}.i5{--ic:var(--c5);--ics:var(--c5s)}.i6{--ic:var(--c6);--ics:var(--c6s)}
.sec-h{display:flex;align-items:center;gap:12px;min-width:0}
.band{position:relative;overflow:hidden;border-radius:24px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--band-a),var(--band-b));display:flex;flex-direction:column;gap:14px}
.band::after{content:"";position:absolute;right:-48px;top:-48px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.band-top,.xp,.band-foot{position:relative;z-index:1}
.band-top{display:flex;align-items:center;gap:14px}
.band p{color:#fff}
.band-hello{font:800 22px/1.15 var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.band-lvl{font-size:14px;font-weight:600}
.avatar{flex:none;display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:hsl(var(--h,260) 55% 40%);color:#fff;font:800 24px/1 var(--f-display);border:3px solid rgba(255,255,255,.55)}
.xp{height:10px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.xp i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .4s}
.band-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.band .btn.light{background:#fff;border-color:#fff;color:#2D2290}
.me{position:relative;display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;border:0;background:hsl(var(--h,260) 55% 40%);color:#fff;font:800 16px/1 var(--f-display);cursor:pointer}
.me small{position:absolute;right:-5px;bottom:-4px;min-width:19px;height:19px;padding:0 4px;border-radius:99px;background:#FFC247;color:#241800;font:800 11px/15px var(--f-body);border:2px solid var(--bg);text-align:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:172px;padding:16px;border-radius:22px;border:0;color:#fff;text-align:left;cursor:pointer}
.tile::after{content:"";position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.15);pointer-events:none}
.tile.t1{background:#5B3FE0}.tile.t2{background:#CF3F29}
.tile .ico{background:rgba(255,255,255,.22);color:#fff}
.tile b{font:800 18px/1.2 var(--f-display);position:relative;z-index:1}
.tile .sub{font-size:14px;line-height:1.35;position:relative;z-index:1}
.tile:hover{filter:brightness(1.07)}
.daydet{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.bfam{display:flex;flex-direction:column;gap:10px}
.bfam-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.bgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.badge b{font-size:15px;line-height:1.1}
.badge small{font-size:12px;line-height:1.2;color:var(--ink-2)}
.medal{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--mc);color:#fff;box-shadow:inset 0 0 0 3px rgba(255,255,255,.38),0 6px 12px -6px var(--mc)}
.medal.t1{--mc:#B5651D}.medal.t2{--mc:#6F7A92}.medal.t3{--mc:#B9820A}.medal.t4{--mc:#5B3FE0}
.medal.lock{background:var(--surface-2);color:var(--ink-2);box-shadow:none}
.nextb{display:flex;flex-direction:column;gap:8px}
.nextb .meter i{background:var(--c5)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.fcard{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;min-width:0}
.fcard:hover{border-color:var(--fc)}
.fcard b{font-weight:700;overflow-wrap:anywhere}
.fcard .muted{font-size:13px}
.sw{position:relative;display:inline-flex}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.sw span{width:36px;height:36px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.sw input:checked+span{border-color:var(--ink)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.savebar{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:20px;background:var(--accent-soft);border:1.5px solid var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font:600 11px var(--f-body);color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;padding-block:4px}
.day{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;padding:6px 2px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:600 14px var(--f-body);font-variant-numeric:tabular-nums;color:var(--ink);cursor:pointer}
.day.blank{border:0;background:none;cursor:default}
.day.l1{background:color-mix(in srgb,var(--c3) 16%,var(--surface))}
.day.l2{background:color-mix(in srgb,var(--c3) 30%,var(--surface))}
.day.l3{background:color-mix(in srgb,var(--c3) 48%,var(--surface))}
.day.today{border-color:var(--c3);box-shadow:inset 0 0 0 1px var(--c3)}

.fiche h2{margin-bottom:2px}
.fiche ul,.fiche ol{margin:0;padding-left:22px;display:grid;gap:8px}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.qcard.rise{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:s}

.steps li::before{content:counter(s);grid-row:span 2;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800}

.steps span{color:var(--ink-2);font-size:14px}

.donut{flex:none}
a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.btn{padding:0 14px}.stats b{font-size:19px}}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-2);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{gap:12px}
.band .band-top .grow p{margin:0}
@media (max-width:420px){.tile{min-height:160px;padding:14px}.tabs button{gap:5px;font-size:13px}}
.cd{margin:6px 0 0;padding-left:20px;font-size:14px;color:var(--ink-2);display:grid;gap:2px}.cd .ok{color:var(--good);font-weight:700}

.qcard{touch-action:pan-y}

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- Réglages du site ---------- */
/* firebase : configuration de ton projet Firebase (vrais comptes : e-mail, mot de passe, Google).
   geminiKey : clé Gemini gratuite pour générer automatiquement fiches et QCM pour tous les visiteurs. */
const CFG={firebase:{apiKey:"AIzaSyBvVJ-4qzNDfUPLH2Dlv_ytM7_g3oT0vO0",authDomain:"mnemo-30487.firebaseapp.com",projectId:"mnemo-30487",storageBucket:"mnemo-30487.firebasestorage.app",messagingSenderId:"1057245513695",appId:"1:1057245513695:web:16a010b9395007453b666a"},geminiKey:''};

/* ---------- Constantes & état ---------- */
const $app=document.getElementById('app'), $toast=document.getElementById('toast');
const DAY=864e5, MAXTEXT=56000, MAXCARDS=120, MAXDOC=235000, LS_BASE='mnemo.v1';
let LS=LS_BASE;
const TYPES={qcm:'QCM',flash:'Flashcard',open:'Question ouverte',vf:'Vrai / faux'};
const S={docs:{}};
let V={name:'home'};
let Q=null;
const G={ctl:null,busy:false,draftId:null,draftFolder:''};
const env={mode:'pending',db:null,col:null,uid:null,sample:null,downloads:null,synced:false,readOnly:false,unsub:null};
const writing={},pending={};
const IN_APP=false;
const A={kind:IN_APP?'app':(CFG.firebase?'firebase':'local'),user:null,ready:false,busy:false,waited:false,fb:null,err:false,started:false};

/* ---------- Utilitaires ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const $=s=>document.querySelector(s);
const plural=(n,a,b)=>n+' '+(n>1?b:a);
let tt=0;
function toast(m){$toast.textContent=m;$toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$toast.classList.remove('show'),3800)}

/* ---------- Persistance : compte (db) + copie locale ---------- */
let mt=0;
function mirrorLocal(){clearTimeout(mt);mt=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify(persistable()))}catch(e){}},300)}
function loadLocal(){try{const j=localStorage.getItem(LS);if(j){const o=JSON.parse(j);if(o&&typeof o==='object')S.docs=o}}catch(e){}}
async function writeOnce(id){const d=S.docs[id];if(d===undefined)await env.col.doc(id).delete();else await env.col.doc(id).set(d)}
function onDbError(e){
  const c=e&&e.code;
  if(c==='quota_exceeded'){toast('Espace plein : supprime des cours ou des cartes pour continuer à enregistrer.');return}
  if(c==='invalid_argument'||c==='not_granted'||c==='revoked'||c==='capability_disabled'||c==='capability_removed'){
    env.readOnly=true;env.mode='ro';if(env.unsub){try{env.unsub()}catch(x){}env.unsub=null}env.col=null;
    toast("Ce compte ne peut pas enregistrer ici : tes données restent sur cet appareil.");refreshChrome();return}
  toast('Sauvegarde impossible pour le moment. Réessaie dans un instant.');
}
function persist(id){
  if(!env.col||env.readOnly||isDraft(id))return;
  pending[id]=true;if(writing[id])return;writing[id]=true;
  (async()=>{
    while(pending[id]){
      pending[id]=false;
      try{try{await writeOnce(id)}catch(e){if(e&&e.code==='unavailable'){await sleep(900);await writeOnce(id)}else throw e}}
      catch(e){onDbError(e);break}
    }
    writing[id]=false;
  })();
}
function put(id,data){S.docs[id]=data;mirrorLocal();persist(id)}
function del(id){delete S.docs[id];mirrorLocal();persist(id)}
function touch(id){mirrorLocal();persist(id)}

function refreshChrome(){const el=$('.sync');if(el){el.className='sync s-'+env.mode;el.textContent=syncLabel()}}
function syncLabel(){return env.mode==='cloud'?'Synchronisé':env.mode==='pending'||env.mode==='sync'?'Connexion…':'Sur cet appareil'}

function subscribe(){
  env.mode='sync';
  env.unsub=env.col.onSnapshot(snap=>{
    const remote={};
    snap.docs.forEach(d=>{const v=d.data();if(v)remote[d.id]=JSON.parse(JSON.stringify(v))});
    if(!env.synced){
      if(snap.metadata.fromCache&&snap.empty)return;
      env.synced=true;
      if(snap.empty&&Object.keys(S.docs).length){
        env.mode='cloud';Object.keys(S.docs).forEach(persist);refreshChrome();return}
      if(!snap.empty){try{localStorage.setItem(LS+'.backup',JSON.stringify(persistable()))}catch(e){}}
    }
    if(env.readOnly)return;
    env.mode='cloud';
    Object.keys(S.docs).forEach(id=>{if(!(id in remote)&&!writing[id]&&!pending[id]&&!isDraft(id))delete S.docs[id]});
    Object.keys(remote).forEach(id=>{if(!writing[id]&&!pending[id])S.docs[id]=remote[id]});
    mirrorLocal();softRender();refreshChrome();
  },err=>{
    env.mode='local';env.col=null;refreshChrome();
    toast('Connexion au compte perdue : tes données restent sur cet appareil.')});
}
/* ---------- Comptes ---------- */
const ACC='mnemo.acc',SESS='mnemo.sess';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const accounts=()=>{try{return JSON.parse(lsGet(ACC))||{}}catch(e){return{}}};
const normMail=s=>String(s||'').trim().toLowerCase();
const okMail=s=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s);
const toB64=u=>btoa(String.fromCharCode.apply(null,Array.from(u)));
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw,salt){
  const sub=window.crypto&&window.crypto.subtle;if(!sub)throw{code:'nocrypto'};
  const key=await sub.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return toB64(new Uint8Array(await sub.deriveBits({name:'PBKDF2',salt:fromB64(salt),iterations:120000,hash:'SHA-256'},key,256)));
}
function startLocal(id,email){
  lsSet(SESS,JSON.stringify({id,email}));lsSet('mnemo.had','1');
  LS=LS_BASE+'.'+id;S.docs={};loadLocal();A.user={id,email:email||''};A.ready=true;env.mode='local';
}
async function localSignup(email,pw){
  const acc=accounts();if(acc[email])throw{code:'auth/email-already-in-use'};
  const salt=toB64(window.crypto.getRandomValues(new Uint8Array(16)));
  const id='u'+uid();acc[email]={id,salt,hash:await hashPw(pw,salt)};lsSet(ACC,JSON.stringify(acc));
  startLocal(id,email);
}
async function localLogin(email,pw){
  const a=accounts()[email];if(!a)throw{code:'auth/user-not-found'};
  if(await hashPw(pw,a.salt)!==a.hash)throw{code:'auth/wrong-password'};
  startLocal(a.id,email);
}
const AUTHERR={
  'auth/email-already-in-use':'Un compte existe déjà avec cet e-mail. Connecte-toi plutôt.',
  'auth/invalid-email':"Cet e-mail n'est pas valide.",
  'auth/weak-password':'Mot de passe trop faible : 8 caractères minimum.',
  'auth/wrong-password':'E-mail ou mot de passe incorrect.',
  'auth/invalid-credential':'E-mail ou mot de passe incorrect.',
  'auth/invalid-login-credentials':'E-mail ou mot de passe incorrect.',
  'auth/user-not-found':'E-mail ou mot de passe incorrect.',
  'auth/too-many-requests':'Trop de tentatives. Réessaie dans quelques minutes.',
  'auth/network-request-failed':'Pas de connexion internet. Réessaie.',
  'auth/unauthorized-domain':"Ce site n'est pas autorisé pour la connexion Google (à régler dans Firebase).",
  'auth/operation-not-allowed':"Cette méthode de connexion n'est pas activée dans Firebase.",
  nocrypto:'Ton navigateur est trop ancien pour créer un compte sécurisé.'
};
const authErr=e=>AUTHERR[e&&e.code]||"Impossible de continuer pour l'instant. Réessaie.";
async function initFirebase(){
  try{
    const base='https://www.gstatic.com/firebasejs/10.12.2/';
    if(!window.firebase){await loadScript(base+'firebase-app-compat.js');await loadScript(base+'firebase-auth-compat.js');await loadScript(base+'firebase-firestore-compat.js')}
    const fb=window.firebase;if(!fb.apps.length)fb.initializeApp(CFG.firebase);
    A.fb=fb;fb.auth().onAuthStateChanged(onFbUser);
  }catch(e){A.err=true;A.ready=true;softRender()}
}
function onFbUser(u){
  A.ready=true;
  if(u&&A.user&&A.user.id===u.uid&&env.col){A.user.email=u.email||'';softRender();return}
  if(env.unsub){try{env.unsub()}catch(x){}env.unsub=null}
  env.col=null;env.synced=false;A.waited=false;S.docs={};clearDraft();
  if(!u){A.user=null;LS=LS_BASE;env.mode='local';softRender();return}
  lsSet('mnemo.had','1');
  A.user={id:u.uid,email:u.email||'',name:u.displayName||''};
  LS=LS_BASE+'.'+u.uid;loadLocal();
  env.col=A.fb.firestore().collection('users').doc(u.uid).collection('docs');
  subscribe();
  setTimeout(()=>{A.waited=true;softRender()},6000);
  softRender();
}
async function initCaps(){
  const use=()=>Promise.resolve(null);
  const [db,user,sample,dl]=await Promise.all([use('db'),use('user'),use('sample'),use('downloads')]);
  env.sample=sample;env.downloads=dl;
  if(A.kind==='app'){
    let id=null;try{id=user?await user.id():null}catch(e){}
    if(db&&id){env.db=db;env.uid=id;env.col=db.collection('data/users/'+id);subscribe()}
    else env.mode='local';
  }else if(A.kind==='firebase'){refreshChrome();await initFirebase();return}
  refreshChrome();
  if(V.name==='course'||V.name==='draft')softRender();
}
function bootSession(){
  if(A.kind==='app'){A.user={id:'me'};A.ready=true;loadLocal();return}
  if(A.kind==='local'){
    let s=null;try{s=JSON.parse(lsGet(SESS))}catch(e){}
    if(s&&s.id)startLocal(s.id,s.email);else A.ready=true;
    env.mode='local';
  }
}
async function logout(){
  if(A.kind==='firebase'&&A.fb){try{await A.fb.auth().signOut()}catch(e){}}
  else{lsSet(SESS,'');A.user=null;S.docs={};LS=LS_BASE;clearDraft()}
  V={name:'login'};render();
}

/* ---------- Accès aux données ---------- */
const subjects=()=>Object.keys(S.docs).filter(k=>k.startsWith('s_')).map(id=>Object.assign({id},S.docs[id])).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
const coursesOf=sid=>Object.keys(S.docs).filter(k=>k.startsWith('c_')&&S.docs[k].subjectId===sid).map(id=>Object.assign({id},S.docs[id])).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
const settings=()=>{const s=S.docs.settings||(S.docs.settings={newPerDay:15,days:{}});if(!s.days)s.days={};if(!s.newPerDay)s.newPerDay=15;return s};
const getCard=(cid,kid)=>{const c=S.docs[cid];return c&&c.cards?c.cards.find(k=>k.id===kid):undefined};
function scoped(scope){
  const out=[];
  for(const id of Object.keys(S.docs)){
    if(!id.startsWith('c_'))continue;const c=S.docs[id];
    if(scope.kind==='subject'&&c.subjectId!==scope.id)continue;
    if(scope.kind==='course'&&id!==scope.id)continue;
    for(const k of (c.cards||[]))out.push({cid:id,card:k});
  }
  return out;
}
function counts(scope){
  const now=Date.now(),L=scoped(scope);let due=0,nw=0,mature=0;
  for(const x of L){const k=x.card;if(!k.reps)nw++;else{if(k.due<=now)due++;if((k.interval||0)>=7)mature++}}
  return{total:L.length,due,nw,mature};
}
function newLeft(){const st=settings(),d=st.days[dk(Date.now())];return Math.max(0,st.newPerDay-(d?d.nw||0:0))}
function lastDays(n){
  const st=settings(),out=[],names=['D','L','M','M','J','V','S'];
  for(let i=n-1;i>=0;i--){const t=Date.now()-i*DAY,d=st.days[dk(t)]||{};out.push({n:d.n||0,ok:d.ok||0,l:names[new Date(t).getDay()],today:i===0})}
  return out;
}
function streak(){
  const st=settings();let t=Date.now(),n=0;
  if(!(st.days[dk(t)]||{}).n)t-=DAY;
  while((st.days[dk(t)]||{}).n){n++;t-=DAY;if(n>3650)break}
  return n;
}

/* ---------- Répétition espacée ---------- */
function nextInt(k,g){
  const i=k.interval||0,e=k.ease||2.5;
  if(g===0)return 0;
  if(g===1)return Math.max(1,Math.round(i*1.2));
  if(g===2)return i===0?1:Math.max(i+1,Math.round(i*e));
  return i===0?3:Math.max(i+2,Math.round(i*e*1.3));
}
function ivLabel(n){if(n<=0)return'Revoir';if(n===1)return'1 j';if(n<30)return n+' j';if(n<365)return Math.round(n/30)+' mois';return'1 an'}
function applyRating(item,g){
  const course=S.docs[item.cid];if(!course)return;
  const k=(course.cards||[]).find(x=>x.id===item.kid);if(!k)return;
  const st=settings(),key=dk(Date.now());
  const day=st.days[key]||(st.days[key]={n:0,ok:0,nw:0});
  const sched=Q.mode==='due',correct=g>=1;
  if(!item.re){
    st.rev=(st.rev||0)+1;markActive();
    day.n++;if(correct)day.ok++;
    day.cs=day.cs||{};day.cs[item.cid]=(day.cs[item.cid]||0)+1;
    k.lastOk=correct;k.last=Date.now();
    if(sched){
      const first=!k.reps;
      if(g===0){if(!first)k.lapses=(k.lapses||0)+1;k.interval=0;k.due=Date.now()}
      else{const ni=nextInt(k,g);k.interval=ni;k.due=sod(Date.now())+ni*DAY}
      k.ease=clamp((k.ease||2.5)+[-0.2,-0.15,0,0.1][g],1.3,3);
      k.reps=(k.reps||0)+1;if(first)day.nw++;
    }
  }else if(sched&&g>=1){k.interval=1;k.due=sod(Date.now())+DAY}
  const keys=Object.keys(st.days);
  if(keys.length>420){keys.sort().slice(0,keys.length-400).forEach(x=>delete st.days[x])}
  touch(item.cid);touch('settings');checkBadges(true);
}
function buildSession(mode,scope){
  const now=Date.now(),L=scoped(scope);let items;
  if(mode==='due'){
    const due=shuffle(L.filter(x=>x.card.reps>0&&x.card.due<=now)).sort((a,b)=>a.card.due-b.card.due);
    const nw=shuffle(L.filter(x=>!x.card.reps)).slice(0,scope.kind==='all'?newLeft():60);
    items=due.concat(nw);
  }else if(mode==='weak'){
    items=shuffle(L.filter(x=>x.card.reps>0&&(x.card.lapses>0||x.card.lastOk===false||(x.card.ease||2.5)<2.2)));
  }else items=shuffle(L);
  return items.slice(0,60).map(x=>({cid:x.cid,kid:x.card.id,re:false}));
}
function startQuiz(mode,scope){
  const queue=buildSession(mode,scope);
  if(!queue.length){toast(mode==='weak'?'Aucun point faible pour le moment.':"Rien à réviser ici pour l'instant.");return}
  Q={mode,scope,queue,pos:0,stage:'ask',anim:true,picked:null,typed:'',hint:0,elim:[],skipped:[],results:[],back:{name:V.name,id:V.id}};
  go({name:'quiz'});
}

/* ---------- Génération par IA ---------- */
const ERR={not_granted:"Tu as refusé l'accès à l'IA pour cette page. Recharge la page pour réessayer.",sampling_disabled:"La génération par IA n'est pas disponible avec ce compte.",rate_limited:"Trop de demandes ou limite d'usage atteinte. Réessaie plus tard.",session_expired:"Ta session a expiré. Reconnecte-toi puis réessaie.",refused:"L'IA n'a pas pu traiter ce texte. Essaie avec un autre extrait.",invalid_json:"La réponse n'était pas exploitable. Réessaie, ou demande moins de questions.",empty_completion:"Réponse vide. Réessaie.",prompt_too_large:"Le texte est trop long pour une seule demande.",upstream_error:"Problème de connexion avec l'IA. Réessaie.",bad_key:"Clé refusée par Google. Vérifie-la dans les réglages.",no_ai:"Aucune IA connectée. Utilise « Coller depuis un chat IA »."};
const AIK='mnemo.ai';
function getAI(){let o={};try{o=JSON.parse(localStorage.getItem(AIK))||{}}catch(e){}if(!o.key&&CFG.geminiKey)o.key=CFG.geminiKey;return o}
function setAI(o){try{localStorage.setItem(AIK,JSON.stringify(o))}catch(e){}}
const hasAI=()=>!!env.sample||!!getAI().key;
function parseLoose(t){
  if(typeof t!=='string')return t;
  t=t.trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  try{return JSON.parse(t)}catch(e){}
  const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf(']'),t.lastIndexOf('}'));
  if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  return null;
}
async function callAI(prompt,signal){
  if(env.sample)return env.sample.json(prompt,{signal});
  const ai=getAI();if(!ai.key)throw{code:'no_ai'};
  let r;
  try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(ai.model||'gemini-2.5-flash')+':generateContent',{method:'POST',signal,headers:{'Content-Type':'application/json','x-goog-api-key':ai.key},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:0.4}})})}

async function runGeneration(cid,opts,host){
  const c=S.docs[cid];if(!c||!c.text)return 0;
  const sub=(S.docs[c.subjectId]||{}).name||'';
  let local=!hasAI();
  const chunks=local?[c.text]:chunkText(c.text);
  const per=local?opts.count:clamp(Math.ceil(opts.count/chunks.length),3,20);
  G.ctl=new AbortController();G.busy=true;
  let total=0,fell=null,usedLocal=false;
  try{
    for(let i=0;i<chunks.length;i++){
      if(G.ctl.signal.aborted)break;
      host.innerHTML=(local?'<p><span class="spin"></span>Mnémo lit ton cours et prépare tes questions…</p>'
        :'<p><span class="spin"></span>L\'IA lit ton cours'+(chunks.length>1?' (partie '+(i+1)+' sur '+chunks.length+')':'')+'… ça prend en général une à deux minutes.</p>'
        +(total?'<p class="small muted">'+plural(total,'carte prête','cartes prêtes')+' pour l\'instant.</p>':'')
        +'<button class="btn sm" data-a="stopgen" type="button">Arrêter</button>');
      const cards=S.docs[cid].cards||[];
      let arr=null;
      if(!local){
        const known=cards.slice(-60).map(k=>k.q.slice(0,90));
        try{arr=await callAI(buildPrompt(c.title,sub,chunks[i],per,opts.types,opts.extra.trim(),known,i+1,chunks.length),G.ctl.signal)}
        catch(e){if(e&&e.code==='cancelled')break;fell=e;local=true;arr=null}
        if(arr&&!Array.isArray(arr)&&Array.isArray(arr.cards))arr=arr.cards;
        if(!local&&!Array.isArray(arr)){fell={code:'invalid_json'};local=true;arr=null}
      }
      if(local){
        await sleep(350);usedLocal=true;
        arr=localCards(chunks[i],per,opts.types,cards.map(k=>k.q));
      }
      const r=addCards(cid,arr.map(normCard).filter(Boolean));
      total+=r.added;
      if(r.full){toast('Limite atteinte : '+MAXCARDS+' cartes par cours. Crée un autre cours pour la suite.');break}
    }
  }finally{G.busy=false;G.ctl=null}
  if(total&&usedLocal&&S.docs[cid])S.docs[cid].local=true;
  if(fell&&total)toast("L'IA n'a pas répondu : j'ai utilisé le moteur intégré de Mnémo à la place.");
  else if(total)toast(plural(total,'carte ajoutée','cartes ajoutées')+'.');
  else if(usedLocal)toast('Je n\'ai pas trouvé assez de matière dans ce texte. Colle un cours plus long ou plus structuré.');
  return total;
}

function localFiche(title,text){

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script'));document.head.appendChild(s)})}
async function pdfToText(file){
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  if(!window.pdfjsLib){await loadScript(base+'pdf.min.js');await loadScript(base+'pdf.worker.min.js')}
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
  const doc=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  let out='';
  for(let p=1;p<=doc.numPages;p++){
    const tc=await (await doc.getPage(p)).getTextContent();
    out+=tc.items.map(i=>i.str+(i.hasEOL?'\n':' ')).join('')+'\n\n';
    if(out.length>MAXTEXT*1.3)break;
  }
  return out;
}

const LEVELS=[{n:1,t:'Curieux',xp:0},{n:2,t:'Apprenti',xp:30},{n:3,t:'Studieux',xp:100},{n:4,t:'Assidu',xp:250},{n:5,t:'Expert',xp:500},{n:6,t:'Maître',xp:1000},{n:7,t:'Légende',xp:2000}];
const BADGE_FAMS=[
  {k:'cards',label:'Cartes créées',ic:'cards',cls:'i1',steps:[10,20,50]},
  {k:'fiches',label:'Fiches méthode',ic:'fiche',cls:'i2',steps:[1,5,10]},
  {k:'rev',label:'Révisions',ic:'check',cls:'i3',steps:[50,200,500]},
  {k:'weeks',label:"Semaines d'utilisation",ic:'cal',cls:'i4',steps:[1,2,4,8]}];
const TIERS=['Bronze','Argent','Or','Diamant'];
function wkKey(t){const d=new Date(sod(t));d.setDate(d.getDate()-((d.getDay()+6)%7));return dk(d.getTime())}
function totals(){
  const st=settings();let cards=0,fiches=0,rev=0;
  const wk=new Set(Object.keys(st.act||{}));
  for(const id of Object.keys(S.docs)){
    if(isDraft(id))continue;const d=S.docs[id];
    if(id.startsWith('c_')){cards+=(d.cards||[]).length;if(d.createdAt)wk.add(wkKey(d.createdAt))}
    else if(id.startsWith('f_')){fiches++;if(d.createdAt)wk.add(wkKey(d.createdAt))}
  }
  Object.keys(st.days).forEach(k=>{const d=st.days[k];rev+=d.n||0;if(d.n){const a=k.split('-').map(Number);wk.add(wkKey(new Date(a[0],a[1]-1,a[2]).getTime()))}});
  return{rev:Math.max(st.rev||0,rev),cards:Math.max(st.madeCards||0,cards),fiches:Math.max(st.madeFiches||0,fiches),weeks:wk.size};
}
const xpOf=t=>t.rev+2*t.cards+20*t.fiches;
function levelInfo(xp){
  let cur=LEVELS[0];for(const l of LEVELS)if(xp>=l.xp)cur=l;
  const next=LEVELS.find(l=>l.n===cur.n+1)||null;
  return{cur,next,pct:next?Math.round((xp-cur.xp)/(next.xp-cur.xp)*100):100};
}
function badgeList(){
  const t=totals(),st=settings(),L=[];
  BADGE_FAMS.forEach(f=>f.steps.forEach((n,i)=>L.push({id:f.k+n,fam:f,n,tier:i+1,val:t[f.k],got:t[f.k]>=n||!!(st.badges||{})[f.k+n]})));
  return L;
}
function checkBadges(speak){
  const st=settings();st.badges=st.badges||{};const t=totals();const neu=[];
  BADGE_FAMS.forEach(f=>f.steps.forEach(n=>{const id=f.k+n;if(t[f.k]>=n&&!st.badges[id]){st.badges[id]=Date.now();neu.push(f.label+' '+n)}}));
  const li=levelInfo(xpOf(t)),up=(st.lvl||1)<li.cur.n;
  if(neu.length||up||st.lvl!==li.cur.n){st.lvl=li.cur.n;touch('settings')}
  let msg='';
  if(up)msg='Niveau '+li.cur.n+' atteint : '+li.cur.t+' !';
  if(neu.length)msg+=(msg?' ':'')+(neu.length>1?'Nouveaux badges : ':'Nouveau badge : ')+neu.join(', ')+'.';
  if(speak&&msg)toast(msg);
  return msg;
}

function forecast(){
  const now=Date.now(),b=sod(now);let t=0,w=0;
  for(const x of scoped({kind:'all'})){const k=x.card;if(!k.reps||k.due<=now)continue;const d=Math.round((k.due-b)/DAY);if(d===1)t++;if(d>=1&&d<=7)w++}
  return{tomorrow:t,week:w};
}
function progressCard(all){
  const fcs=forecast(),wk=lastDays(7),mx=Math.max.apply(null,wk.map(d=>d.n)),w7=wk.reduce((a,d)=>a+d.n,0),o7=wk.reduce((a,d)=>a+d.ok,0);

   +'<div class="stats"><div><span class="muted small">Série</span><b>'+streak()+' j</b></div><div><span class="muted small">Maîtrisées</span><b>'+all.mature+'/'+all.total+'</b></div><div><span class="muted small">Réussite 7 j</span><b>'+(w7?Math.round(o7/w7*100)+' %':'–')+'</b></div></div>'
   +'<div class="week" role="img" aria-label="Cartes révisées sur les 7 derniers jours">'
   +wk.map(d=>'<div class="wd'+(d.today?' today':'')+'"><span class="v">'+(d.n||'')+'</span><div class="b'+(d.n?'':' z')+'" style="height:'+(d.n&&mx?Math.max(6,Math.round(d.n/mx*70)):3)+'px"></div><span class="l">'+d.l+'</span></div>').join('')+'</div></section>';
}

async function submitImport(withGen){
  const val=id=>document.getElementById(id).value;
  const err=m=>{const e=$('#imp-err');e.textContent=m;e.hidden=false;e.scrollIntoView({block:'center'})};
  const raw=cleanText(val('imp-text'));
  const text=raw.slice(0,MAXTEXT);
  if(text.length<200)return err('Colle un texte plus long (200 caractères minimum) pour que le résultat ait du sens.');
  if(raw.length>MAXTEXT)toast('Ton cours dépasse '+MAXTEXT.toLocaleString('fr-FR')+' caractères : seule la première partie est utilisée.');
  const out=(document.querySelector('input[name="imo"]:checked')||{}).value||'both';
  const title=val('imp-title').trim()||lcTitle(text);
  const dc=newDraft(title,text);
  if(!withGen){go({name:'draft',id:dc,man:out!=='fiche',fman:out==='fiche'});return}
  const opts=readGen($('#imp')),host=$('#imp-prog');
  G.stop=false;
  let n=0,fid=null;
  if(out!=='fiche')n=await runGeneration(dc,opts,host);
  if(out!=='qcm'&&!G.stop)fid=await runFiche(dc,host);
  go({name:'draft',id:dc});
  if(n||fid)toast('Prêt ! Relis, choisis un dossier et clique sur Enregistrer.');
}

/* ---------- Vue : révision ---------- */
function curItem(){
  for(;;){
    while(Q.pos<Q.queue.length&&!getCard(Q.queue[Q.pos].cid,Q.queue[Q.pos].kid))Q.pos++;
    if(Q.pos<Q.queue.length)return Q.queue[Q.pos];
    if(Q.skipped&&Q.skipped.length){Q.queue=Q.queue.concat(Q.skipped);Q.skipped=[];continue}
    return null;
  }
}
function hintMax(k){
  if(k.type==='qcm')return Math.max(0,Math.min(2,k.choices.length-2));
  if(k.type==='vf')return 1;
  return 2;
}
function hintFor(k,lvl){
  if(k.type==='vf')return 'Relis chaque mot : un chiffre, un nom ou une négation a peut-être été changé.';
  const w=String(k.a||'').replace(/\s+/g,' ').trim().split(' ');
  if(lvl===1)return 'La réponse fait '+w.length+' mot'+(w.length>1?'s':'')+' et commence par « '+w[0].slice(0,12)+(w[0].length>12?'…':'')+' ».';
  const n=Math.max(2,Math.ceil(w.length/2));
  return 'Début de la réponse : « '+w.slice(0,n).join(' ')+' … »';
}
function viewQuiz(){
  const item=curItem();if(!item)return viewDone();
  const k=getCard(item.cid,item.kid),c=S.docs[item.cid],s=S.docs[c.subjectId]||{};
  const sk=Q.skipped?Q.skipped.length:0,total=Q.queue.length+sk,sched=Q.mode==='due',rev=Q.stage==='reveal';
  const elim=Q.elim||[],hint=Q.hint||0,hm=hintMax(k);
  let h='<div class="qhead"><button class="btn ghost sm" data-a="quit">Quitter</button><div class="qprog" role="progressbar" aria-valuemin="0" aria-valuemax="'+total+'" aria-valuenow="'+Q.pos+'"><i style="width:'+Math.round(Q.pos/total*100)+'%"></i></div><span class="mono small">'+Math.min(Q.pos+1,total)+'/'+total+'</span></div>';
  h+='<div class="qmeta"><span class="dot" style="--fc:var(--c'+(s.col||1)+')"></span><span>'+esc(s.name||'Sans dossier')+' · '+esc(c.title)+'</span><span class="chip">'+TYPES[k.type]+'</span>'+(item.re?'<span class="chip warn">à retenter</span>':'')+(sk?'<span class="chip">'+sk+' passée'+(sk>1?'s':'')+'</span>':'')+'</div>';
  h+='<div class="qcard'+(Q.anim&&!rev?' rise':'')+'" id="qcard"><div class="qtext">'+rich(k.q)+'</div>';
  if(k.type==='qcm'){
    h+='<div class="stack">'+k.choices.map((ch,i)=>{let cl='choice';if(rev){cl+=i===k.answer?' ok':i===Q.picked?' ko':' dim'}else if(elim.includes(i))cl+=' dim';
      return '<button class="'+cl+'" data-a="pick" data-i="'+i+'"'+(rev||elim.includes(i)?' disabled':'')+'><b>'+String.fromCharCode(65+i)+'</b><span>'+rich(ch)+'</span></button>'}).join('')+'</div>';
  }else if(k.type==='vf'){
    h+='<div class="rate" style="grid-template-columns:1fr 1fr">'+[[1,'Vrai'],[0,'Faux']].map(p=>{let cl='choice';if(rev){const isAns=(p[0]===1)===k.answer;cl+=isAns?' ok':((p[0]===1)===Q.picked?' ko':' dim')}
      return '<button class="'+cl+'" style="justify-content:center;font-weight:600" data-a="pick" data-i="'+p[0]+'"'+(rev?' disabled':'')+'>'+p[1]+'</button>'}).join('')+'</div>';
  }else if(k.type==='open'&&!rev){
    h+='<label class="f" for="typed">Ta réponse <small>facultatif, écrire aide à mémoriser</small><textarea id="typed" rows="4">'+esc(Q.typed||'')+'</textarea></label>';
  }
  if(!rev){
    if(hint){h+='<div class="hintbox" role="status">'+(k.type==='qcm'?(hint>1?'Deux mauvaises réponses ont été éliminées.':'Une mauvaise réponse a été éliminée.'):esc(hintFor(k,hint)))+'</div>'}
    if(k.type==='flash'||k.type==='open')h+='<button class="btn primary block" data-a="reveal">'+(k.type==='open'?'Voir la réponse':'Montrer la réponse')+'</button>';
    h+='<div class="qtools"><button class="btn sm" data-a="hint"'+(hint>=hm?' disabled':'')+'>'+ic('bulb',16)+'Indice'+(hm?' ('+hint+'/'+hm+')':'')+'</button><button class="btn sm ghost" data-a="skip">Passer'+ic('next',16)+'</button></div>';
  }else{
    if(k.type==='qcm'||k.type==='vf'){
      const ok=Q.picked===k.answer;
      h+='<p class="verdict '+(ok?'ok':'ko')+'" role="status">'+(ok?'Bonne réponse':'Pas tout à fait')+'</p>';
      if(k.type==='vf')h+='<p class="small muted">La bonne réponse : <strong>'+(k.answer?'Vrai':'Faux')+'</strong>.</p>';
      if(k.explain)h+='<div class="answer"><span class="lbl">Explication</span><div>'+rich(k.explain)+'</div></div>';
      h+='<div class="wrap" style="justify-content:flex-end">'+(ok&&!hint?'<button class="btn" data-a="rate" data-g="3">Trop facile</button>':'')+'<button class="btn primary" data-a="rate" data-g="'+(ok?2:0)+'">Suivant'+ic('next',16)+'</button></div>';
    }else{
      if(k.type==='open'&&Q.typed)h+='<div class="answer"><span class="lbl">Ta réponse</span><div>'+rich(Q.typed)+'</div></div>';
      h+='<div class="answer"><span class="lbl">'+(k.type==='open'?'Réponse attendue':'Réponse')+'</span><div><span class="mk">'+rich(k.a)+'</span></div></div>';
      h+='<div class="stack"><span class="small muted">Tu t\'en souvenais ?'+(hint?' <em>(indice utilisé : « Facile » indisponible)</em>':'')+'</span><div class="rate">'+[['À revoir',0],['Difficile',1],['Bien',2],['Facile',3]].map(p=>{
        const sub=sched?(item.re?(p[1]===0?'Revoir':'1 j'):ivLabel(nextInt(k,p[1]))):'';
        return '<button class="g'+p[1]+'" data-a="rate" data-g="'+p[1]+'"'+(hint&&p[1]===3?' disabled':'')+'>'+p[0]+'<small>'+sub+'</small></button>'}).join('')+'</div></div>';
    }
  }
  h+='</div>';
  if(!sched)h+='<p class="small muted">'+(Q.mode==='free'?'Révision libre':'Points faibles')+' : cette série ne modifie pas le planning des cartes.</p>';
  h+='<p class="small muted" style="text-align:center">Glisse la carte vers la gauche pour passer à la suivante</p>';
  if(window.matchMedia&&matchMedia('(hover:hover)').matches)h+='<p class="kbd">Espace : révéler ou continuer · 1 à 4 : choisir ou noter · H : indice · → : passer</p>';
  return h;
}
function viewDone(){
  const r=Q.results,n=r.length,ok=r.filter(x=>x.g>=1).length;
  const missed=r.filter(x=>x.g===0).map(x=>getCard(x.cid,x.kid)).filter(Boolean);
  let h='<div class="stack"><p class="eyebrow">Série terminée</p><h1 class="h1">'+(n?(ok===n?'Sans faute.':ok/n>=.7?'Bien joué.':'Ça se construit.'):'Rien à revoir.')+'</h1>';
  if(n){const pc=Math.round(ok/n*100);h+='<div style="display:flex;align-items:center;gap:16px"><svg class="donut" viewBox="0 0 36 36" width="88" height="88" role="img" aria-label="'+pc+' % de réussite"><circle cx="18" cy="18" r="15.9" fill="none" stroke-width="3.4" style="stroke:var(--surface-2)"/><circle cx="18" cy="18" r="15.9" fill="none" stroke-width="3.4" stroke-linecap="round" pathLength="100" stroke-dasharray="'+pc+' 100" transform="rotate(-90 18 18)" style="stroke:var(--accent)"/><text x="18" y="21.5" text-anchor="middle" font-size="9" font-weight="800" style="fill:var(--ink)">'+pc+'%</text></svg><p class="muted"><span class="mono">'+ok+'/'+n+'</span> réussies</p></div>'}
  h+='</div>';
  if(missed.length)h+='<section class="stack"><h2 class="h2">À retravailler</h2><div class="list">'+missed.map(k=>'<div class="cardrow"><div class="q">'+rich(k.q)+'</div></div>').join('')+'</div></section>';
  const more=buildSession(Q.mode,Q.scope).length;
  h+='<div class="wrap">'+(more&&Q.mode==='due'?'<button class="btn primary" data-a="again">Série suivante ('+more+')</button>':'')+'<button class="btn'+(more&&Q.mode==='due'?'':' primary')+'" data-a="quit">Terminer</button></div>';
  return h;
}
function quizReveal(){
  const item=curItem();if(!item)return;
  const k=getCard(item.cid,item.kid);
  if(k.type==='open'){const t=document.getElementById('typed');Q.typed=t?t.value.trim():''}
  Q.stage='reveal';Q.anim=false;render();
}
function quizPick(i){
  const item=curItem();if(!item||Q.stage!=='ask')return;
  const k=getCard(item.cid,item.kid);if(k.type==='qcm'&&(Q.elim||[]).includes(i))return;
  Q.picked=k.type==='vf'?i===1:i;Q.stage='reveal';Q.anim=false;render();
}
function quizHint(){
  const item=curItem();if(!item||Q.stage!=='ask')return;
  const k=getCard(item.cid,item.kid),mx=hintMax(k);if((Q.hint||0)>=mx)return;
  const t=document.getElementById('typed');if(t)Q.typed=t.value;
  if(k.type==='qcm'){const wrong=k.choices.map((_,i)=>i).filter(i=>i!==k.answer&&!(Q.elim||[]).includes(i));if(wrong.length)Q.elim=(Q.elim||[]).concat(shuffle(wrong)[0])}
  Q.hint=(Q.hint||0)+1;Q.anim=false;render();
}
function quizSkip(){
  const item=curItem();if(!item||Q.stage!=='ask')return;
  (Q.skipped=Q.skipped||[]).push({cid:item.cid,kid:item.kid,re:item.re});
  Q.pos++;Q.hint=0;Q.elim=[];Q.typed='';Q.picked=null;Q.anim=true;render();window.scrollTo(0,0);
}
function quizNext(){
  const item=curItem();if(!item)return;const k=getCard(item.cid,item.kid);
  if(Q.stage==='ask')quizSkip();
  else if(k.type==='qcm'||k.type==='vf')quizRate(Q.picked===k.answer?2:0);
}
function quizRate(g){
  const item=curItem();if(!item||Q.stage!=='reveal')return;
  if(Q.hint&&g===3)g=2;
  const first=!item.re;
  applyRating(item,g);
  if(first)Q.results.push({cid:item.cid,kid:item.kid,g});
  if(g===0)Q.queue.splice(Math.min(Q.queue.length,Q.pos+5),0,{cid:item.cid,kid:item.kid,re:true});
  Q.pos++;Q.stage='ask';Q.picked=null;Q.typed='';Q.hint=0;Q.elim=[];Q.anim=true;render();window.scrollTo(0,0);
}

async function doExport(){

  const name='mnemo-sauvegarde-'+dk(Date.now())+'.json';

    catch(e){if(e&&e.code==='declined')return}
  }else{
    try{
      const u=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');
      a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
      mark();toast('Sauvegarde téléchargée.');if(V.name==='home')render();return;
    }catch(e){}
  }
  mark();go({name:'settings',exportText:data});toast('Copie le texte ci-dessous et garde-le dans un fichier.');
}
function importBackup(text){

}

function normFiche(x){
  if(x&&!Array.isArray(x)&&typeof x==='object'&&x.fiche&&typeof x.fiche==='object')x=x.fiche;
  if(!x||typeof x!=='object'||Array.isArray(x))return null;
  const str=(v,n)=>typeof v==='string'?v.trim().slice(0,n||600):'';
  const arr=(v,n,m)=>Array.isArray(v)?v.map(i=>str(i,n)).filter(Boolean).slice(0,m):[];
  const A=v=>Array.isArray(v)?v:[];
  const f={
    title:str(x.title,120),summary:str(x.summary,1500),
    sections:A(x.sections).map(q=>({heading:str(q&&q.heading,120),points:arr(q&&q.points,400,10)})).filter(q=>q.heading&&q.points.length).slice(0,10),
    definitions:A(x.definitions).map(q=>({term:str(q&&q.term,100),def:str(q&&q.def,400)})).filter(q=>q.term&&q.def).slice(0,20),
    facts:A(x.key_facts||x.facts).map(q=>({label:str(q&&q.label,100),value:str(q&&q.value,300)})).filter(q=>q.label&&q.value).slice(0,15),
    method:arr(x.method,400,10),pitfalls:arr(x.pitfalls,400,8),selftest:arr(x.selftest,300,8)
  };
  if(!f.summary&&!f.sections.length)return null;
  return f;
}
function buildFichePrompt(course,subject,text){
  return "Tu es un professeur expert en méthodes de travail. À partir du cours ci-dessous, rédige une fiche méthode de révision claire, utile et facile à mémoriser, dans la langue du cours.\n"
   +(subject?"Matière : "+subject+"\n":"")+"Titre du cours : "+course+"\n\n"
   +"Réponds uniquement par un objet JSON, sans texte autour, avec exactement cette structure :\n"
   +'{"title":"titre de la fiche","summary":"résumé en 3 à 5 phrases","sections":[{"heading":"partie du cours","points":["idée essentielle en une phrase"]}],"definitions":[{"term":"notion","def":"définition courte"}],"key_facts":[{"label":"formule, date ou chiffre à connaître","value":"énoncé ou valeur"}],"method":["étape concrète pour appliquer le cours ou résoudre un exercice type"],"pitfalls":["erreur fréquente à éviter"],"selftest":["question pour vérifier qu\'on a compris"]}\n'
   +"Règles : 4 à 8 sections au maximum, des points courts et mémorisables, uniquement des informations présentes dans le cours, method = démarche en 4 à 7 étapes, laisse un tableau vide si une rubrique ne s'applique pas.\n"
   +'\nTexte du cours :\n\u0022\u0022\u0022\n'+text+'\n\u0022\u0022\u0022';
}
async function runFiche(cid,host){
  const c=S.docs[cid];if(!c||!c.text)return null;
  const sub=(S.docs[c.subjectId]||{}).name||'';
  G.ctl=new AbortController();G.busy=true;
  try{
    let f=null,fell=false;
    if(hasAI()){
      host.innerHTML='<p><span class="spin"></span>L\'IA prépare ta fiche méthode… compte environ une minute.</p><button class="btn sm" data-a="stopgen" type="button">Arrêter</button>';
      try{const out=await callAI(buildFichePrompt(c.title,sub,c.text),G.ctl.signal);f=normFiche(out);if(!f)throw{code:'invalid_json'}}
      catch(e){if(e&&e.code==='cancelled')return null;fell=true;f=null}
    }
    let local=false;
    if(!f){
      host.innerHTML='<p><span class="spin"></span>Mnémo rédige ta fiche méthode…</p>';await sleep(350);
      f=normFiche(localFiche(c.title,c.text));local=true;
      if(f&&fell)toast("L'IA n'a pas répondu : j'ai utilisé le moteur intégré de Mnémo à la place.");
    }
    if(!f){toast('Je n\'ai pas trouvé assez de matière pour une fiche. Colle un cours plus long ou plus structuré.');return null}
    const id=addDraftFiche(f,c.title,isDraft(cid)?'':cid,c.subjectId);
    if(local)S.docs[id].local=true;
    return id;
  }finally{G.busy=false;G.ctl=null}
}

function ficheText(d){
  const f=d.data||{},L=[d.title,''];
  if(f.summary)L.push('L\'ESSENTIEL',f.summary,'');
  (f.sections||[]).forEach(q=>{L.push(q.heading.toUpperCase());q.points.forEach(x=>L.push('- '+x));L.push('')});
  if((f.definitions||[]).length){L.push('DÉFINITIONS');f.definitions.forEach(q=>L.push(q.term+' : '+q.def));L.push('')}
  if((f.facts||[]).length){L.push('À CONNAÎTRE PAR CŒUR');f.facts.forEach(q=>L.push(q.label+' : '+q.value));L.push('')}
  if((f.method||[]).length){L.push('MÉTHODE');f.method.forEach((x,i)=>L.push((i+1)+'. '+x));L.push('')}
  if((f.pitfalls||[]).length){L.push('PIÈGES À ÉVITER');f.pitfalls.forEach(x=>L.push('- '+x));L.push('')}
  if((f.selftest||[]).length){L.push('POUR TE TESTER');f.selftest.forEach(x=>L.push('- '+x))}
  return L.join('\n').trim();
}

      if(A.kind!=='firebase'||!A.fb){toast("La connexion Google n'est pas encore activée sur ce site (voir le guide de mise en ligne).");break}

      catch(x){

      }

      if(!okMail(mail))return toast("Écris d'abord ton e-mail dans le champ ci-dessus.");
      if(A.kind==='firebase'){try{await A.fb.auth().sendPasswordResetEmail(mail);toast('E-mail envoyé : vérifie ta boîte de réception.')}catch(x){toast(authErr(x))}}
      else toast("Sur cette version, le mot de passe ne peut pas être récupéré. Crée un nouveau compte si besoin.");
      break}
    case 'logout':await logout();break;
    case 'signup':{
      const complete=V.name==='complete',full=!complete&&A.kind!=='app';
      const r=readProfile('su'),er=$('#su-err'),bad=m=>{er.textContent=m;er.hidden=false};

      let mail='';

        if(pw.length<8)return bad('Choisis un mot de passe de 8 caractères minimum.');
        A.busy=true;el.disabled=true;
        try{
          if(A.kind==='firebase'){
            const cred=await A.fb.auth().createUserWithEmailAndPassword(mail,pw);

            if(!A.user||A.user.id!==cred.user.uid||!env.col)onFbUser(cred.user);
          }else await localSignup(mail,pw);

        A.busy=false;
      }
      put('profile',{firstName:r.name,gender:r.g,birth:r.b,email:mail||(A.user&&A.user.email)||'',createdAt:Date.now()});
      toast('Bienvenue, '+r.name+' !');authDone();break}
    case 'saveprofile':{
      const r=readProfile('pf'),er=$('#pf-err');
      if(r.err){er.textContent=r.err;er.hidden=false;break}
      const pr=S.docs.profile;pr.firstName=r.name;pr.gender=r.g;pr.birth=r.b;touch('profile');
      er.hidden=true;toast('Profil enregistré.');break}
    /* dossiers */
    case 'newfolder':V.newf=true;if(V.name!=='library')go({name:'library',newf:true});else render();break;
    case 'cancelfolder':V.newf=false;render();break;
    case 'createfolder':{
      const n=$('#nf-name').value.trim(),er=$('#nf-err');
      if(!n){er.textContent='Donne un nom à ton dossier.';er.hidden=false;break}
      const col=Number((document.querySelector('input[name="nf-c"]:checked')||{}).value)||1;
      const nid='s_'+uid();put(nid,{name:n,col,createdAt:Date.now()});V.newf=false;toast('Dossier créé.');go({name:'folder',id:nid});break}
    case 'rename':V.rename=true;render();break;
    case 'cancelrename':V.rename=false;render();break;
    case 'saverename':{
      const n=$('#rn').value.trim(),col=Number((document.querySelector('input[name="rn-c"]:checked')||{}).value)||1;
      if(n){const s=S.docs[V.id];s.name=n.slice(0,40);s.col=col;touch(V.id)}V.rename=false;render();break}
    case 'askdelfolder':V.confirm='delfolder';render();break;
    case 'delfolder':{
      Object.keys(S.docs).forEach(k=>{if((k.startsWith('c_')||k.startsWith('f_'))&&S.docs[k].subjectId===V.id){S.docs[k].subjectId='';touch(k)}});
      del(V.id);V.confirm=null;toast('Dossier supprimé.');go({name:'library'});break}
    /* enregistrement manuel */
    case 'savedraft':{
      if(!draftHasContent()){toast("Il n'y a rien à enregistrer.");break}
      const sel=$('#sv-folder');let sid=sel?sel.value:'';
      if(sid==='__new'){
        const n=($('#sv-new').value||'').trim();if(!n){toast('Donne un nom au nouveau dossier.');break}
        const col=subjects().length%6+1;sid='s_'+uid();put(sid,{name:n.slice(0,40),col,createdAt:Date.now()});
      }
      const r=saveDraft(sid);
      const what=r.nc&&r.nf?'QCM et fiche enregistrés':r.nc?'QCM enregistré':'Fiche enregistrée';
      toast(what+'.'+(r.msg?' '+r.msg:''));
      go({name:'folder',id:sid||'__none'});break}
    case 'deldraftcard':{const c=S.docs[draftCourse()];if(c){c.cards=c.cards.filter(x=>x.id!==el.dataset.kid);render()}break}
    /* fiches */
    case 'genfiche':{
      const wasDraft=isDraft(V.id);
      if(!wasDraft&&draftHasContent())clearDraft();
      V.fgen=true;render();
      const fid=await runFiche(V.id,$('#fprog'));
      V.fgen=false;
      if(fid){go({name:'draft',id:G.draftId||''});toast('Fiche prête : choisis un dossier et clique sur Enregistrer.')}else render();
      break}
    case 'openfman':V.fman=true;render();break;
    case 'closefman':V.fman=false;render();break;
    case 'copyfiche':{
      const c=S.docs[V.id],p=buildFichePrompt(c.title,'',c.text);
      const out=$('#fm-out');out.value=p;out.hidden=false;
      try{await navigator.clipboard.writeText(p);toast('Consigne copiée. Colle-la dans ton chat IA.')}
      catch(x){out.focus();out.select();toast('Copie le texte affiché (Ctrl+C ou appui long).')}
      break}
    case 'createfiche':{
      const f=normFiche(parseLoose($('#fm-in').value));
      if(!f)return toast("Je n'ai pas trouvé de fiche dans ce texte. Colle toute la réponse de l'IA.");
      const c=S.docs[V.id],wasDraft=isDraft(V.id);
      if(!wasDraft&&draftHasContent())clearDraft();
      addDraftFiche(f,c.title,wasDraft?'':V.id,c.subjectId);V.fman=false;go({name:'draft',id:G.draftId||''});toast('Fiche prête : enregistre-la dans un dossier.');break}
    case 'copyficheview':{
      const d=S.docs[V.name==='draft'?draftFicheId():V.id];
      try{await navigator.clipboard.writeText(ficheText(d));toast('Fiche copiée.')}catch(x){toast('Copie impossible ici.')}
      break}
    case 'printfiche':window.print();break;
    case 'askdelfiche':V.confirm='delfiche';render();break;
    case 'delfiche':{const sid=S.docs[V.id].subjectId||'__none';del(V.id);V.confirm=null;toast('Fiche supprimée.');go({name:'folder',id:sid});break}
    /* révision */
    case 'start':startQuiz(el.dataset.m,el.dataset.k==='all'?{kind:'all'}:{kind:el.dataset.k,id:id||''});break;
    case 'again':startQuiz(Q.mode,Q.scope);break;
    case 'quit':{const b=Q&&Q.back?Q.back:{name:'home'};go(b.name==='quiz'?{name:'home'}:b);break}
    case 'reveal':quizReveal();break;
    case 'pick':quizPick(Number(el.dataset.i));break;
    case 'hint':quizHint();break;
    case 'skip':quizSkip();break;
    case 'rate':quizRate(Number(el.dataset.g));break;
    case 'impgo':submitImport(true);break;
    case 'impsave':submitImport(false);break;
    case 'stopgen':G.stop=true;if(G.ctl)G.ctl.abort();break;
    case 'opengen':V.gen=true;render();break;
    case 'cancelgen':V.gen=false;render();break;
    case 'rungen':{
      const opts=readGen($('#genbox'));V.gen=true;
      const n=await runGeneration(V.id,opts,$('#gprog'));
      V.gen=false;if(V.name==='course'||V.name==='draft')render();
      if(!n)toast('Aucune nouvelle carte.');break}
    case 'openman':V.man=true;render();break;
    case 'closeman':V.man=false;render();break;
    case 'copyprompt':{
      const c=S.docs[V.id],chunks=chunkText(c.text),i=Number(el.dataset.p),o=readGen($('#manbox'));
      const per=clamp(Math.ceil(o.count/chunks.length),3,20);
      const p=buildPrompt(c.title,(S.docs[c.subjectId]||{}).name||'',chunks[i],per,o.types,o.extra.trim(),(c.cards||[]).slice(-60).map(k=>k.q.slice(0,90)),i+1,chunks.length);
      const out=$('#man-out');out.value=p;out.hidden=false;
      try{await navigator.clipboard.writeText(p);toast('Consigne copiée. Colle-la dans ton chat IA.')}
      catch(x){out.focus();out.select();toast('Copie le texte affiché (Ctrl+C ou appui long).')}
      break}
    case 'mancreate':{
      let arr=parseLoose($('#man-in').value);
      if(arr&&!Array.isArray(arr)&&Array.isArray(arr.cards))arr=arr.cards;
      if(!Array.isArray(arr))return toast("Je n'ai pas trouvé de tableau JSON dans ce texte. Colle toute la réponse de l'IA.");
      const r=addCards(V.id,arr.map(normCard).filter(Boolean));
      if(!r.added)return toast('Aucune carte valide trouvée dans cette réponse.');
      toast(plural(r.added,'carte ajoutée','cartes ajoutées')+(r.full?' (limite atteinte).':'.'));V.man=false;render();break}
    case 'newcard':V.edit={draft:{type:'flash'}};render();break;
    case 'editcard':{const k=getCard(V.id,el.dataset.kid);if(k){V.edit={kid:k.id,cid2:1,draft:JSON.parse(JSON.stringify(k))};render()}break}
    case 'cancelcard':V.edit=null;render();break;
    case 'savecard':{
      const d=readCardForm(),er=$('#cf-err');const bad=m=>{er.textContent=m;er.hidden=false};
      if(!d.q)return bad('Écris la question.');
      if((d.type==='flash'||d.type==='open')&&!d.a)return bad('Écris la réponse.');
      if(d.type==='qcm'){const f=d.choices.filter(Boolean);if(f.length<2||!d.choices[d.answer])return bad('Remplis au moins deux choix et coche la bonne réponse.');
        const idx=d.choices.map((c,i)=>i).filter(i=>d.choices[i]);d.answer=idx.indexOf(d.answer);d.choices=f}
      const c=S.docs[V.id];
      if(V.edit.kid){const k=c.cards.find(x=>x.id===V.edit.kid);Object.keys(d).forEach(x=>k[x]=d[x])}
      else{
        if(c.cards.length>=MAXCARDS)return bad('Limite de '+MAXCARDS+' cartes atteinte pour ce cours.');
        c.cards.push(Object.assign({id:uid()+Math.random().toString(36).slice(2,5),ease:2.5,interval:0,reps:0,lapses:0,due:0,lastOk:null},d));
        bump('madeCards',1);
      }
      touch(V.id);V.edit=null;render();toast('Carte enregistrée.');checkBadges(true);break}
    case 'delcard':{
      const kid=el.dataset.kid;
      if(V.confirm==='k'+kid){const c=S.docs[V.id];c.cards=c.cards.filter(x=>x.id!==kid);touch(V.id);V.confirm=null;render()}
      else{V.confirm='k'+kid;render()}break}
    case 'askdelcourse':V.confirm='delcourse';render();break;
    case 'delcourse':{const sid=S.docs[V.id].subjectId||'__none';del(V.id);V.confirm=null;toast('QCM supprimé.');go({name:'folder',id:sid});break}
    case 'snooze':settings().remindAt=Date.now()+7*DAY;touch('settings');render();break;
    case 'renamec':V.renameC=true;render();break;
    case 'cancelrenamec':V.renameC=false;render();break;
    case 'saverenamec':{const n=document.getElementById('rnc').value.trim();if(n){S.docs[V.id].title=n;touch(V.id)}V.renameC=false;render();break}
    case 'export':doExport();break;
    case 'askwipe':V.confirm='wipe';render();break;
    case 'wipe':{Object.keys(S.docs).forEach(k=>{if(k!=='profile')del(k)});G.draftId=null;V.confirm=null;toast('Données effacées.');go({name:'home'});break}
  }
});
$app.addEventListener('change',async e=>{
  const t=e.target;
  if(t.name==='imo'){const q=document.getElementById('imp-qopts');if(q)q.hidden=t.value==='fiche'}
  else if(t.id==='imp-file'&&t.files&&t.files[0]){
    const f=t.files[0],er=$('#imp-err');er.hidden=true;
    try{
      let txt;
      if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){er.textContent='Lecture du PDF…';er.hidden=false;er.style.color='var(--ink-2)';txt=await pdfToText(f);er.hidden=true;er.style.color=''}
      else txt=await f.text();
      txt=cleanText(txt);
      if(txt.length<50)throw new Error('vide');
      const ta=document.getElementById('imp-text');ta.value=(ta.value?ta.value+'\n\n':'')+txt;
      ta.dispatchEvent(new Event('input',{bubbles:true}));
      
    }catch(x){er.style.color='';er.textContent="Impossible de lire ce fichier (un PDF scanné n'a pas de texte). Colle plutôt le texte du cours.";er.hidden=false}
    t.value='';
  }
  else if(t.dataset&&t.dataset.i==='svf'){G.draftFolder=t.value==='__new'?'':t.value;const l=document.getElementById('sv-newl');if(l){l.hidden=t.value!=='__new';if(t.value==='__new')document.getElementById('sv-new').focus()}}
  else if(t.dataset&&(t.dataset.i==='mvc'||t.dataset.i==='mvf')){const d=S.docs[V.id];if(d){d.subjectId=t.value;touch(V.id);toast('Déplacé.')}}
  else if(t.dataset&&t.dataset.i==='cftype'){V.edit.draft=readCardForm();V.edit.draft.type=t.value;render()}
  else if(t.name==='cfl'){applyCardFilter()}
  else if(t.dataset&&t.dataset.i==='thm'){try{localStorage.setItem('mnemo.theme',t.value)}catch(x){}applyTheme()}
  else if(t.dataset&&t.dataset.i==='gk'){setAI(Object.assign({},getAI(),{key:t.value.trim()}));toast('Clé enregistrée sur cet appareil.')}
  else if(t.dataset&&t.dataset.i==='gm'){setAI(Object.assign({},getAI(),{model:t.value.trim()||'gemini-2.5-flash'}));toast('Modèle enregistré.')}
  else if(t.dataset&&t.dataset.i==='npd'){settings().newPerDay=Number(t.value);touch('settings');toast('Enregistré.')}
  else if(t.id==='bk-file'&&t.files&&t.files[0]){const f=t.files[0];importBackup(await f.text());t.value=''}
});
$app.addEventListener('input',e=>{
  if(e.target.id==='cs-q'){applyCardFilter();return}
  if(e.target.id==='lib-q'){
    const q=e.target.value.trim().toLowerCase(),res=document.getElementById('lib-res'),grid=document.getElementById('lib-grid'),none=document.getElementById('lib-none');
    let n=0;res.querySelectorAll('.irow').forEach(r=>{const ok=!q||r.dataset.s.indexOf(q)>=0;r.hidden=!ok;if(ok)n++});
    res.hidden=!q;if(grid)grid.hidden=!!q;none.hidden=!q||n>0;return}
  if(e.target.id==='imp-text'){const n=e.target.value.length,c=document.getElementById('imp-count');
    c.textContent=n.toLocaleString('fr-FR')+' / '+MAXTEXT.toLocaleString('fr-FR')+' caractères';c.style.color=n>MAXTEXT?'var(--bad)':''}
});
let tpos=null;
$app.addEventListener('touchstart',e=>{if(V.name!=='quiz'||!e.target.closest('.qcard'))return;const t=e.touches[0];tpos={x:t.clientX,y:t.clientY}},{passive:true});
$app.addEventListener('touchend',e=>{if(!tpos||V.name!=='quiz')return;const t=e.changedTouches[0],dx=t.clientX-tpos.x,dy=t.clientY-tpos.y;tpos=null;if(dx<-70&&Math.abs(dy)<60)quizNext()},{passive:true});
window.addEventListener('beforeunload',e=>{if(draftHasContent()){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{
  if(V.name!=='quiz'||!Q||e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='textarea'||tag==='input'||tag==='select')return;
  const item=curItem();if(!item)return;const k=getCard(item.cid,item.kid);
  if(e.key==='ArrowRight'){quizNext();e.preventDefault();return}
  if(e.key==='h'||e.key==='H'){quizHint();e.preventDefault();return}
  const isSpace=e.key===' '||e.key==='Enter';
  if(Q.stage==='ask'){
    if(k.type==='qcm'&&/^[1-4]$/.test(e.key)&&Number(e.key)-1<k.choices.length){quizPick(Number(e.key)-1);e.preventDefault()}
    else if(k.type==='vf'&&(e.key==='1'||e.key==='2')){quizPick(e.key==='1'?1:0);e.preventDefault()}
    else if((k.type==='flash'||k.type==='open')&&isSpace){quizReveal();e.preventDefault()}
  }else if(Q.stage==='reveal'){
    if(k.type==='qcm'||k.type==='vf'){if(isSpace){quizRate(Q.picked===k.answer?2:0);e.preventDefault()}}
    else if(/^[1-4]$/.test(e.key)){quizRate(Number(e.key)-1);e.preventDefault()}
  }
});

/* ---------- Démarrage ---------- */
bootSession();
applyTheme();
render();
initCaps();
})();
</script>

</body>
</html>
