<style>
/* Layout: une colonne de 720px, en-tête collant ; la révision pose une grande carte au centre, comme une fiche sur un bureau. */
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --surface-2:#E7EDEF; --ink:#11201F; --ink-2:#51636A; --line:#D5DEE1;
  --accent:#0B7F78; --accent-ink:#FFFFFF; --accent-soft:#D6EFEC;
  --mark:#C9EBE6; --mark-ink:#11201F;
  --good:#12805C; --good-soft:#D5F1E5; --bad:#C23A3A; --bad-soft:#F9DCDC; --warn:#9A5A08; --warn-soft:#FBEBCF;
  --f-display:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1214; --surface:#121C1F; --surface-2:#1A2629; --ink:#E6F0EF; --ink-2:#93A7A9; --line:#243236;
  --accent:#38C7BA; --accent-ink:#06201E; --accent-soft:#12403E; --mark:#17504C; --mark-ink:#E6F0EF;
  --good:#4FD1A0; --good-soft:#133A2D; --bad:#FF8A8A; --bad-soft:#431C24; --warn:#E3A44F; --warn-soft:#3F2E12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1214; --surface:#121C1F; --surface-2:#1A2629; --ink:#E6F0EF; --ink-2:#93A7A9; --line:#243236;
  --accent:#38C7BA; --accent-ink:#06201E; --accent-soft:#12403E; --mark:#17504C; --mark-ink:#E6F0EF;
  --good:#4FD1A0; --good-soft:#133A2D; --bad:#FF8A8A; --bad-soft:#431C24; --warn:#E3A44F; --warn-soft:#3F2E12; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);padding-inline:16px;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.app{max-width:720px;margin:0 auto;padding-block:20px 24px;display:flex;flex-direction:column;gap:20px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.top-r{display:flex;align-items:center;gap:8px;min-width:0}
.brand{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:6px 0;cursor:pointer;font:800 21px/1 var(--f-display);letter-spacing:-.02em;color:var(--ink)}
.logo svg{display:block}
.mark{color:var(--accent)}
.sync{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--f-mono);color:var(--ink-2);white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-2)}
.sync.s-cloud::before{background:var(--good)}
.sync.s-ro::before,.sync.s-local::before{background:var(--warn)}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.h1{font:800 clamp(28px,6vw,38px)/1.08 var(--f-display);letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.h2{font:700 19px/1.2 var(--f-display);letter-spacing:-.01em}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:20px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-align:center}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;cursor:pointer;text-align:left}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.item:last-child{border-bottom:0}
button.item:hover{background:var(--surface-2)}
.item .t{font-weight:600;overflow-wrap:anywhere}
.dot{flex:none;width:12px;height:12px;border-radius:3px;background:hsl(var(--h,215) 70% 52%)}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;background:var(--surface-2);font:500 12px var(--f-mono);color:var(--ink-2);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);border-radius:99px}

.hero{display:flex;flex-direction:column;gap:16px}
.hero-n{display:flex;align-items:flex-end;gap:16px}
.big{font:800 clamp(72px,22vw,112px)/.85 var(--f-display);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.hero-n p{padding-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{min-width:0}
.stats b{display:block;font:500 22px var(--f-mono);font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:112px}
.wd{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.wd .v{font:500 12px var(--f-mono);color:var(--ink-2)}
.wd .b{width:100%;max-width:36px;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:3px}
.wd .b.z{background:var(--surface-2)}
.wd .l{font:500 11px var(--f-mono);color:var(--ink-2);text-transform:uppercase}
.wd.today .l{color:var(--ink);font-weight:500}

label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label.f small{font-weight:400;color:var(--ink-2)}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
textarea{resize:vertical;line-height:1.5}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:inline-flex}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.opt span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;font-size:14px}
.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.drop{display:flex;align-items:center;justify-content:center;min-height:56px;border:1.5px dashed var(--line);border-radius:12px;color:var(--ink-2);font-weight:600;cursor:pointer;text-align:center;padding:10px}
.drop:hover{border-color:var(--accent);color:var(--accent)}
.err{color:var(--bad);font-size:14px;font-weight:600}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px}

.qhead{display:flex;align-items:center;gap:12px}
.qprog{flex:1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,30px);display:flex;flex-direction:column;gap:20px;box-shadow:0 1px 0 var(--line),0 12px 28px -18px rgba(20,27,46,.35)}
.qtext{font:600 clamp(21px,4.6vw,27px)/1.3 var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.choice{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;min-height:52px}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice b{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--surface-2);font:500 13px var(--f-mono)}
.choice span{padding-top:2px;overflow-wrap:anywhere}
.choice.ok{border-color:var(--good);background:var(--good-soft)}
.choice.ok b{background:var(--good);color:var(--bg)}
.choice.ko{border-color:var(--bad);background:var(--bad-soft)}
.choice.ko b{background:var(--bad);color:var(--bg)}
.choice.dim{opacity:.55}
.choice:disabled{cursor:default}
.answer{border-radius:12px;background:var(--surface-2);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.answer .mk{background:linear-gradient(transparent 50%,var(--mark) 50%);color:var(--ink);display:inline;padding-inline:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.answer .lbl{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px;padding:8px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.rate button small{font:500 11px var(--f-mono);color:var(--ink-2)}
.rate button:hover{border-color:var(--ink)}
.rate .g0{color:var(--bad)}.rate .g3{color:var(--good)}
.verdict{font:700 18px var(--f-display)}
.verdict.ok{color:var(--good)}.verdict.ko{color:var(--bad)}
.kbd{font:500 12px var(--f-mono);color:var(--ink-2)}
.spin{display:inline-block;width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
details summary{cursor:pointer;font-weight:600}
.txt{max-height:240px;overflow:auto;white-space:pre-wrap;font-size:14px;color:var(--ink-2);margin-top:10px;overflow-wrap:anywhere}
.cardrow{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line)}
.cardrow:last-child{border-bottom:0}
.cardrow .q{overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;max-width:720px;margin:0 auto;padding-bottom:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 1 auto;min-height:40px;padding:0 8px;font-size:14px;border:0;border-radius:10px;background:none;color:var(--ink-2);font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.svcs{display:grid;gap:12px}
.svc{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:18px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.svc:hover{border-color:var(--accent)}
.svc b{display:block;font:700 18px/1.25 var(--f-display)}
.svc .grow>span{display:block;color:var(--ink-2);font-size:14px;margin-top:2px}
.svc-i{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--accent)}
.svc.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.svc.primary .grow>span{color:inherit;opacity:.88}
.svc.primary .svc-i{background:rgba(255,255,255,.2);color:var(--accent-ink)}
@media (min-width:640px){.svcs{grid-template-columns:1fr 1fr}.svcs .svc:first-child{grid-column:1/-1}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font:600 11px var(--f-body);color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;padding-block:4px}
.day{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;padding:6px 2px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:600 14px var(--f-body);font-variant-numeric:tabular-nums;color:var(--ink);cursor:pointer}
.day.blank{border:0;background:none;cursor:default}
.day.l1{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.day.l2{background:color-mix(in srgb,var(--accent) 28%,var(--surface))}
.day.l3{background:color-mix(in srgb,var(--accent) 46%,var(--surface))}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:1px}
.ind{display:flex;gap:3px;height:7px}
.ind i{width:7px;height:7px;border-radius:50%}
.ind .r{background:var(--accent)}
.ind .f{background:var(--warn);border-radius:2px}
.ind .u{border:1.5px solid var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.cap{display:block}.cap::first-letter{text-transform:uppercase}
.fiche h2{margin-bottom:2px}
.fiche ul,.fiche ol{margin:0;padding-left:22px;display:grid;gap:8px}
.fiche .defs{margin:0;display:grid;gap:10px}
.fiche .defs dt{font-weight:700}
.fiche .defs dd{margin:2px 0 0;color:var(--ink-2)}
.fiche .facts{display:grid;gap:8px}
.fiche .facts div{display:flex;flex-wrap:wrap;gap:4px 12px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.fiche .facts b{font-weight:700}
.fiche .pit li::marker{color:var(--warn)}
@media print{.top,.foot,.noprint,.toast{display:none!important}body{background:#fff;color:#000}.card{border-color:#bbb;break-inside:avoid}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.qcard.rise{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;column-gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.steps li::before{content:counter(s);grid-row:span 2;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800}
.steps b{font-weight:700}
.steps span{color:var(--ink-2);font-size:14px}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--warn-soft);border-radius:14px;padding:14px 16px}
.foot{max-width:720px;margin:0 auto;padding-block:4px 40px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;color:var(--ink-2);font-size:13px}
.donut{flex:none}
a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.btn{padding:0 14px}.stats b{font-size:19px}}
</style>

<body>
<noscript>Mnémo a besoin de JavaScript pour fonctionner.</noscript>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- Constantes & état ---------- */
const $app=document.getElementById('app'), $toast=document.getElementById('toast');
const DAY=864e5, MAXTEXT=56000, MAXCARDS=120, MAXDOC=235000, LS='mnemo.v1';
const TYPES={qcm:'QCM',flash:'Flashcard',open:'Question ouverte',vf:'Vrai / faux'};
const HUES=[215,12,150,275,42,330,185,95];
const S={docs:{}};
let V={name:'home'};
let Q=null;
const G={ctl:null,busy:false};
const env={mode:'pending',db:null,col:null,uid:null,sample:null,downloads:null,synced:false,readOnly:false,unsub:null};
const writing={},pending={};
const IN_APP=false;

/* ---------- Utilitaires ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const $=s=>document.querySelector(s);
const plural=(n,a,b)=>n+' '+(n>1?b:a);
let tt=0;
function toast(m){$toast.textContent=m;$toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$toast.classList.remove('show'),3800)}

/* ---------- Persistance : compte (db) + copie locale ---------- */
let mt=0;
function mirrorLocal(){clearTimeout(mt);mt=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify(S.docs))}catch(e){}},300)}
function loadLocal(){try{const j=localStorage.getItem(LS);if(j){const o=JSON.parse(j);if(o&&typeof o==='object')S.docs=o}}catch(e){}}
async function writeOnce(id){const d=S.docs[id];if(d===undefined)await env.col.doc(id).delete();else await env.col.doc(id).set(d)}
function onDbError(e){
  const c=e&&e.code;
  if(c==='quota_exceeded'){toast('Espace plein : supprime des cours ou des cartes pour continuer à enregistrer.');return}
  if(c==='invalid_argument'||c==='not_granted'||c==='revoked'||c==='capability_disabled'||c==='capability_removed'){
    env.readOnly=true;env.mode='ro';if(env.unsub){try{env.unsub()}catch(x){}env.unsub=null}env.col=null;
    toast("Ce compte ne peut pas enregistrer ici : tes données restent sur cet appareil.");refreshChrome();return}
  toast('Sauvegarde impossible pour le moment. Réessaie dans un instant.');
}
function persist(id){
  if(!env.col||env.readOnly)return;
  pending[id]=true;if(writing[id])return;writing[id]=true;
  (async()=>{
    while(pending[id]){
      pending[id]=false;

function subscribe(){
  env.mode='sync';
  env.unsub=env.col.onSnapshot(snap=>{
    const remote={};
    snap.docs.forEach(d=>{const v=d.data();if(v)remote[d.id]=JSON.parse(JSON.stringify(v))});
    if(!env.synced){
      if(snap.metadata.fromCache&&snap.empty)return;
      env.synced=true;
      if(snap.empty&&Object.keys(S.docs).length){
        env.mode='cloud';Object.keys(S.docs).forEach(persist);refreshChrome();return}
      if(!snap.empty){try{localStorage.setItem(LS+'.backup',JSON.stringify(S.docs))}catch(e){}}
    }
    if(env.readOnly)return;
    env.mode='cloud';
    Object.keys(S.docs).forEach(id=>{if(!(id in remote)&&!writing[id]&&!pending[id])delete S.docs[id]});
    Object.keys(remote).forEach(id=>{if(!writing[id]&&!pending[id])S.docs[id]=remote[id]});
    mirrorLocal();softRender();refreshChrome();
  },err=>{
    env.mode='local';env.col=null;refreshChrome();
    toast('Connexion au compte perdue : tes données restent sur cet appareil.')});
}

function nextInt(k,g){
  const i=k.interval||0,e=k.ease||2.5;
  if(g===0)return 0;
  if(g===1)return Math.max(1,Math.round(i*1.2));
  if(g===2)return i===0?1:Math.max(i+1,Math.round(i*e));
  return i===0?3:Math.max(i+2,Math.round(i*e*1.3));
}

function applyRating(item,g){
  const course=S.docs[item.cid];if(!course)return;
  const k=(course.cards||[]).find(x=>x.id===item.kid);if(!k)return;
  const st=settings(),key=dk(Date.now());
  const day=st.days[key]||(st.days[key]={n:0,ok:0,nw:0});
  const sched=Q.mode==='due',correct=g>=1;
  if(!item.re){
    day.n++;if(correct)day.ok++;
    day.cs=day.cs||{};day.cs[item.cid]=(day.cs[item.cid]||0)+1;
    k.lastOk=correct;k.last=Date.now();
    if(sched){
      const first=!k.reps;
      if(g===0){if(!first)k.lapses=(k.lapses||0)+1;k.interval=0;k.due=Date.now()}
      else{const ni=nextInt(k,g);k.interval=ni;k.due=sod(Date.now())+ni*DAY}
      k.ease=clamp((k.ease||2.5)+[-0.2,-0.15,0,0.1][g],1.3,3);
      k.reps=(k.reps||0)+1;if(first)day.nw++;
    }
  }else if(sched&&g>=1){k.interval=1;k.due=sod(Date.now())+DAY}
  const keys=Object.keys(st.days);
  if(keys.length>420){keys.sort().slice(0,keys.length-400).forEach(x=>delete st.days[x])}
  touch(item.cid);touch('settings');
}
function buildSession(mode,scope){
  const now=Date.now(),L=scoped(scope);let items;
  if(mode==='due'){
    const due=shuffle(L.filter(x=>x.card.reps>0&&x.card.due<=now)).sort((a,b)=>a.card.due-b.card.due);
    const nw=shuffle(L.filter(x=>!x.card.reps)).slice(0,newLeft());
    items=due.concat(nw);
  }else if(mode==='weak'){
    items=shuffle(L.filter(x=>x.card.reps>0&&(x.card.lapses>0||x.card.lastOk===false||(x.card.ease||2.5)<2.2)));
  }else items=shuffle(L);
  return items.slice(0,60).map(x=>({cid:x.cid,kid:x.card.id,re:false}));
}

const ERR={not_granted:"Tu as refusé l'accès à l'IA pour cette page. Recharge la page pour réessayer.",sampling_disabled:"La génération par IA n'est pas disponible avec ce compte.",rate_limited:"Trop de demandes ou limite d'usage atteinte. Réessaie plus tard.",session_expired:"Ta session a expiré. Reconnecte-toi puis réessaie.",refused:"L'IA n'a pas pu traiter ce texte. Essaie avec un autre extrait.",invalid_json:"La réponse n'était pas exploitable. Réessaie, ou demande moins de questions.",empty_completion:"Réponse vide. Réessaie.",prompt_too_large:"Le texte est trop long pour une seule demande.",upstream_error:"Problème de connexion avec l'IA. Réessaie.",bad_key:"Clé refusée par Google. Vérifie-la dans les réglages.",no_ai:"Aucune IA connectée. Utilise « Coller depuis un chat IA »."};
const AIK='mnemo.ai';
function getAI(){try{return JSON.parse(localStorage.getItem(AIK))||{}}catch(e){return{}}}
function setAI(o){try{localStorage.setItem(AIK,JSON.stringify(o))}catch(e){}}

function parseLoose(t){
  if(typeof t!=='string')return t;
  t=t.trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  try{return JSON.parse(t)}catch(e){}
  const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf(']'),t.lastIndexOf('}'));
  if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  return null;
}
async function callAI(prompt,signal){
  if(env.sample)return env.sample.json(prompt,{signal});
  const ai=getAI();if(!ai.key)throw{code:'no_ai'};
  let r;
  try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(ai.model||'gemini-2.5-flash')+':generateContent',{method:'POST',signal,headers:{'Content-Type':'application/json','x-goog-api-key':ai.key},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:0.4}})})}
  catch(e){throw{code:e&&e.name==='AbortError'?'cancelled':'upstream_error'}}
  if(!r.ok)throw{code:r.status===429?'rate_limited':(r.status===400||r.status===401||r.status===403)?'bad_key':'upstream_error'};
  const j=await r.json().catch(()=>null);
  const parts=j&&j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts;
  const out=parseLoose(parts?parts.map(p=>p.text||'').join(''):'');
  if(out==null)throw{code:'invalid_json'};
  return out;
}
function chunkText(t){
  const n=Math.min(5,Math.max(1,Math.ceil(t.length/14000))),size=Math.ceil(t.length/n);
  if(n===1)return[t];
  let paras=[];
  for(let p of t.split(/\n{2,}/)){while(p.length>size*1.5){let cut=p.lastIndexOf('. ',size);if(cut<size*.5)cut=size;paras.push(p.slice(0,cut+1));p=p.slice(cut+1)}if(p.trim())paras.push(p)}
  const out=[];let cur='';
  for(const p of paras){cur=cur?cur+'\n\n'+p:p;if(cur.length>=size){out.push(cur);cur=''}}
  if(cur)out.push(cur);
  return out;
}
function buildPrompt(course,subject,chunk,n,types,extra,known,idx,total){
  const spec={
    qcm:'{"type":"qcm","q":"question","choices":["choix","choix","choix","choix"],"answer":0,"explain":"pourquoi c\'est la bonne réponse"}  // 4 choix plausibles, answer = index (0 à 3) de la bonne réponse',
    flash:'{"type":"flash","q":"notion, terme ou question courte","a":"réponse concise, 1 à 3 phrases"}',
    open:'{"type":"open","q":"question de compréhension qui demande de réfléchir","a":"réponse modèle attendue, 2 à 4 phrases"}',
    vf:'{"type":"vf","q":"affirmation précise","answer":true,"explain":"pourquoi c\'est vrai ou faux"}  // answer vaut true ou false'};
  return "Tu es un professeur qui prépare des cartes de révision à partir d'un cours.\n"
   +"Matière : "+subject+"\nTitre du cours : "+course+(total>1?"\nExtrait "+idx+" sur "+total+" du cours.":"")+"\n\n"
   +"Rédige exactement "+n+" cartes de révision, dans la langue du cours, en te basant UNIQUEMENT sur le texte fourni. Va à l'essentiel : définitions, mécanismes, formules, dates, causes et conséquences, pièges fréquents. Une idée par carte, réponses vérifiables dans le texte. Évite les détails sans importance.\n"
   +"Mélange équilibré des types suivants : "+types.join(', ')+".\n\n"
   +"Réponds uniquement par un tableau JSON, sans texte autour. Formats :\n"+types.map(t=>spec[t]).join('\n')+"\n"
   +(extra?"\nConsigne de l'élève : "+extra+"\n":"")
   +(known.length?"\nQuestions déjà créées (ne les répète pas) :\n"+known.map(q=>"- "+q).join('\n')+"\n":"")
   +"\nTexte du cours :\n\"\"\"\n"+chunk+"\n\"\"\"";
}
function normCard(x){
  if(!x||typeof x!=='object')return null;
  const str=v=>typeof v==='string'?v.trim().slice(0,1500):'';
  const type=['qcm','flash','open','vf'].includes(x.type)?x.type:null,q=str(x.q);
  if(!type||!q)return null;
  const k={id:uid()+Math.random().toString(36).slice(2,5),type,q,ease:2.5,interval:0,reps:0,lapses:0,due:0,lastOk:null};
  if(type==='qcm'){
    let ch=Array.isArray(x.choices)?x.choices.map(str).filter(Boolean):[];const a=Number(x.answer);
    if(ch.length<3||!Number.isInteger(a)||a<0||a>=ch.length)return null;
    const idx=shuffle(ch.map((_,i)=>i));k.choices=idx.map(i=>ch[i]);k.answer=idx.indexOf(a);k.explain=str(x.explain);
  }else if(type==='vf'){
    const v=x.answer;k.answer=v===true||v==='true'||v==='vrai';if(!(v===true||v===false||v==='true'||v==='false'||v==='vrai'||v==='faux'))return null;k.explain=str(x.explain);
  }else{k.a=str(x.a);if(!k.a)return null}
  return k;
}
const docBytes=d=>new Blob([JSON.stringify(d)]).size;
function addCards(cid,cards){
  const c=S.docs[cid];if(!c)return{added:0,full:false};
  c.cards=c.cards||[];let added=0,full=false;
  for(const k of cards){
    if(c.cards.length>=MAXCARDS){full=true;break}
    c.cards.push(k);
    if(docBytes(c)>MAXDOC){c.cards.pop();full=true;break}
    added++;
  }
  if(added)put(cid,c);
  return{added,full};
}

async function runGeneration(cid,opts,host){
  const c=S.docs[cid];if(!c||!c.text)return 0;
  const sub=(S.docs[c.subjectId]||{}).name||'';
  const chunks=chunkText(c.text);
  const per=clamp(Math.ceil(opts.count/chunks.length),3,20);
  G.ctl=new AbortController();G.busy=true;
  let total=0,err=null;
  try{
    for(let i=0;i<chunks.length;i++){
      if(G.ctl.signal.aborted)break;
      host.innerHTML='<p><span class="spin"></span>L\'IA lit ton cours'+(chunks.length>1?' (partie '+(i+1)+' sur '+chunks.length+')':'')+'… ça prend en général une à deux minutes.</p>'
        +(total?'<p class="small muted">'+plural(total,'carte prête','cartes prêtes')+' pour l\'instant.</p>':'')
        +'<button class="btn sm" data-a="stopgen" type="button">Arrêter</button>';
      const known=(S.docs[cid].cards||[]).slice(-60).map(k=>k.q.slice(0,90));
      let arr;
      try{arr=await callAI(buildPrompt(c.title,sub,chunks[i],per,opts.types,opts.extra.trim(),known,i+1,chunks.length),G.ctl.signal)}
      catch(e){if(e&&e.code==='cancelled')break;err=e;break}
      if(arr&&!Array.isArray(arr)&&Array.isArray(arr.cards))arr=arr.cards;
      if(!Array.isArray(arr)){err={code:'invalid_json'};break}
      const r=addCards(cid,arr.map(normCard).filter(Boolean));
      total+=r.added;
      if(r.full){toast('Limite atteinte : '+MAXCARDS+' cartes par cours. Crée un autre cours pour la suite.');break}
    }
  }finally{G.busy=false;G.ctl=null}
  if(err){toast(ERR[err.code]||ERR.upstream_error);}
  else if(total)toast(plural(total,'carte ajoutée','cartes ajoutées')+'.');
  return total;
}

async function pdfToText(file){
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  if(!window.pdfjsLib){await loadScript(base+'pdf.min.js');await loadScript(base+'pdf.worker.min.js')}
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
  const doc=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  let out='';

    const tc=await (await doc.getPage(p)).getTextContent();
    out+=tc.items.map(i=>i.str+(i.hasEOL?'\n':' ')).join('')+'\n\n';
    if(out.length>MAXTEXT*1.3)break;

async function submitImport(withGen){

  const text=cleanText(val('imp-text')).slice(0,MAXTEXT);
  if(text.length<200)return err('Colle un texte plus long (200 caractères minimum) pour que le résultat ait du sens.');
  const out=(document.querySelector('input[name="imo"]:checked')||{}).value||'qcm';
  let sid=val('imp-sub');
  if(sid==='__new'){
    const name=val('imp-new').trim();if(!name)return err('Donne un nom à la nouvelle matière.');
    sid='s_'+uid();put(sid,{name,hue:HUES[subjects().length%HUES.length],createdAt:Date.now()});
  }
  const title=val('imp-title').trim()||'Cours sans titre';
  const cid='c_'+uid();
  put(cid,{subjectId:sid,title,text,createdAt:Date.now(),cards:[]});
  if(!withGen){toast('Cours enregistré.');go({name:'course',id:cid,man:!hasAI()&&out!=='fiche',fman:!hasAI()&&out==='fiche'});return}
  const opts=readGen($('#imp')),host=$('#imp-prog');
  G.stop=false;
  let n=0,fid=null;
  if(out!=='fiche')n=await runGeneration(cid,opts,host);
  if(out!=='qcm'&&!G.stop)fid=await runFiche(cid,host);
  if(fid&&out==='fiche'){go({name:'fiche',id:fid});toast('Fiche créée.');return}
  go({name:'course',id:cid});
  if(fid)toast('Fiche créée : tu la retrouves dans l\'onglet Fiches.');
  else if(!n&&out!=='qcm')toast('Rien généré. Tu peux réessayer depuis le cours.');
}

function quizRate(g){

  }
  if(fi[sel]){
    empty=false;
    det+='<div class="stack"><span class="eyebrow">Fiches méthode créées</span><div class="list">'+fi[sel].map(id=>'<button class="item" data-a="openfiche" data-id="'+id+'"><span class="grow"><span class="t">'+esc(S.docs[id].title)+'</span><span class="muted small" style="display:block">'+esc((S.docs[S.docs[id].subjectId]||{}).name||'')+'</span></span><span class="muted">›</span></button>').join('')+'</div></div>';

/* ---------- Fiches méthode ---------- */
function normFiche(x){
  if(x&&!Array.isArray(x)&&typeof x==='object'&&x.fiche&&typeof x.fiche==='object')x=x.fiche;
  if(!x||typeof x!=='object'||Array.isArray(x))return null;
  const str=(v,n)=>typeof v==='string'?v.trim().slice(0,n||600):'';
  const arr=(v,n,m)=>Array.isArray(v)?v.map(i=>str(i,n)).filter(Boolean).slice(0,m):[];
  const A=v=>Array.isArray(v)?v:[];
  const f={
    title:str(x.title,120),summary:str(x.summary,1500),
    sections:A(x.sections).map(q=>({heading:str(q&&q.heading,120),points:arr(q&&q.points,400,10)})).filter(q=>q.heading&&q.points.length).slice(0,10),
    definitions:A(x.definitions).map(q=>({term:str(q&&q.term,100),def:str(q&&q.def,400)})).filter(q=>q.term&&q.def).slice(0,20),
    facts:A(x.key_facts||x.facts).map(q=>({label:str(q&&q.label,100),value:str(q&&q.value,300)})).filter(q=>q.label&&q.value).slice(0,15),
    method:arr(x.method,400,10),pitfalls:arr(x.pitfalls,400,8),selftest:arr(x.selftest,300,8)
  };
  if(!f.summary&&!f.sections.length)return null;
  return f;
}
function buildFichePrompt(course,subject,text){
  return "Tu es un professeur expert en méthodes de travail. À partir du cours ci-dessous, rédige une fiche méthode de révision claire, utile et facile à mémoriser, dans la langue du cours.\n"
   +"Matière : "+subject+"\nTitre du cours : "+course+"\n\n"
   +"Réponds uniquement par un objet JSON, sans texte autour, avec exactement cette structure :\n"
   +'{"title":"titre de la fiche","summary":"résumé en 3 à 5 phrases","sections":[{"heading":"partie du cours","points":["idée essentielle en une phrase"]}],"definitions":[{"term":"notion","def":"définition courte"}],"key_facts":[{"label":"formule, date ou chiffre à connaître","value":"énoncé ou valeur"}],"method":["étape concrète pour appliquer le cours ou résoudre un exercice type"],"pitfalls":["erreur fréquente à éviter"],"selftest":["question pour vérifier qu\'on a compris"]}\n'
   +"Règles : 4 à 8 sections au maximum, des points courts et mémorisables, uniquement des informations présentes dans le cours, method = démarche en 4 à 7 étapes, laisse un tableau vide si une rubrique ne s'applique pas.\n"
   +'\nTexte du cours :\n\u0022\u0022\u0022\n'+text+'\n\u0022\u0022\u0022';
}
function addFiche(cid,f){
  const c=S.docs[cid],id='f_'+uid();
  put(id,{courseId:cid,subjectId:c.subjectId,title:f.title||('Fiche : '+c.title),createdAt:Date.now(),data:f});
  return id;
}
async function runFiche(cid,host){
  const c=S.docs[cid];if(!c||!c.text)return null;
  const sub=(S.docs[c.subjectId]||{}).name||'';
  G.ctl=new AbortController();G.busy=true;
  try{
    host.innerHTML='<p><span class="spin"></span>L\'IA prépare ta fiche méthode… compte environ une minute.</p><button class="btn sm" data-a="stopgen" type="button">Arrêter</button>';
    const out=await callAI(buildFichePrompt(c.title,sub,c.text),G.ctl.signal);
    const f=normFiche(out);if(!f)throw{code:'invalid_json'};
    return addFiche(cid,f);
  }catch(e){
    if(!(e&&e.code==='cancelled'))toast(ERR[e&&e.code]||ERR.upstream_error);
    return null;
  }finally{G.busy=false;G.ctl=null}
}

}
function ficheText(d){
  const f=d.data||{},L=[d.title,''];
  if(f.summary)L.push('L\'ESSENTIEL',f.summary,'');
  (f.sections||[]).forEach(q=>{L.push(q.heading.toUpperCase());q.points.forEach(x=>L.push('- '+x));L.push('')});
  if((f.definitions||[]).length){L.push('DÉFINITIONS');f.definitions.forEach(q=>L.push(q.term+' : '+q.def));L.push('')}
  if((f.facts||[]).length){L.push('À CONNAÎTRE PAR CŒUR');f.facts.forEach(q=>L.push(q.label+' : '+q.value));L.push('')}
  if((f.method||[]).length){L.push('MÉTHODE');f.method.forEach((x,i)=>L.push((i+1)+'. '+x));L.push('')}
  if((f.pitfalls||[]).length){L.push('PIÈGES À ÉVITER');f.pitfalls.forEach(x=>L.push('- '+x));L.push('')}
  if((f.selftest||[]).length){L.push('POUR TE TESTER');f.selftest.forEach(x=>L.push('- '+x))}
  return L.join('\n').trim();
}

  h+='<div class="wrap noprint"><button class="btn" data-a="copyficheview">Copier le texte</button>'+(IN_APP?'':'<button class="btn" data-a="printfiche">Imprimer / PDF</button>')
   +(c&&(c.cards||[]).length?'<button class="btn" data-a="start" data-m="free" data-k="course" data-id="'+d.courseId+'">S\'entraîner sur ce cours</button>':'')
   +(c?'<button class="btn ghost" data-a="course" data-id="'+d.courseId+'">Voir le cours</button>':'')+'</div>';
  h+='<article class="stack-lg fiche">';
  if(f.summary)h+='<section class="card stack"><h2 class="h2">L\'essentiel</h2><p>'+rich(f.summary)+'</p></section>';
  (f.sections||[]).forEach(q=>{h+='<section class="card stack"><h2 class="h2">'+esc(q.heading)+'</h2>'+ul(q.points)+'</section>'});
  if((f.definitions||[]).length)h+='<section class="card stack"><h2 class="h2">Notions clés</h2><dl class="defs">'+f.definitions.map(q=>'<div><dt>'+esc(q.term)+'</dt><dd>'+rich(q.def)+'</dd></div>').join('')+'</dl></section>';
  if((f.facts||[]).length)h+='<section class="card stack"><h2 class="h2">À connaître par cœur</h2><div class="facts">'+f.facts.map(q=>'<div><b>'+esc(q.label)+'</b><span>'+rich(q.value)+'</span></div>').join('')+'</div></section>';
  if((f.method||[]).length)h+='<section class="card stack"><h2 class="h2">Méthode pas à pas</h2><ol>'+f.method.map(x=>'<li>'+rich(x)+'</li>').join('')+'</ol></section>';
  if((f.pitfalls||[]).length)h+='<section class="card stack"><h2 class="h2">Pièges à éviter</h2>'+ul(f.pitfalls,'pit')+'</section>';
  if((f.selftest||[]).length)h+='<section class="card stack"><h2 class="h2">Pour te tester</h2>'+ul(f.selftest)+'</section>';
  const plan=[[0,'Relis la fiche une fois, à voix haute.'],[1,'Rappelle-toi les points sans regarder, puis vérifie.'],[3,'Refais les questions du cours.'],[7,'Reprends la méthode sur un exercice.'],[14,'Test final sans la fiche.'],[30,'Dernier rappel pour fixer à long terme.']];
  h+='<section class="card stack noprint"><h2 class="h2">Plan de révision conseillé</h2><ol>'+plan.map(q=>'<li><b style="text-transform:capitalize">'+esc(new Date(sod(d.createdAt)+q[0]*DAY).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}))+'</b> · '+q[1]+'</li>').join('')+'</ol></section>';
  h+='</article><section class="card stack noprint"><h2 class="h2">Gérer la fiche</h2><div class="wrap">'+(V.confirm==='delfiche'?'<button class="btn sm danger" data-a="delfiche">Confirmer la suppression</button>':'<button class="btn sm danger" data-a="askdelfiche">Supprimer la fiche</button>')+'</div></section>';
  return h;
}

    case 'snooze':settings().remindAt=Date.now()+7*DAY;touch('settings');render();break;
    case 'renamec':V.renameC=true;render();break;
    case 'cancelrenamec':V.renameC=false;render();break;
    case 'saverenamec':{const n=document.getElementById('rnc').value.trim();if(n){S.docs[V.id].title=n;touch(V.id)}V.renameC=false;render();break}
    case 'export':doExport();break;

$app.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='imp-sub'){const nl=document.getElementById('imp-newl');nl.hidden=t.value!=='__new'}
  else if(t.name==='imo'){const q=document.getElementById('imp-qopts');if(q)q.hidden=t.value==='fiche'}
  else if(t.id==='imp-file'&&t.files&&t.files[0]){
    const f=t.files[0],er=$('#imp-err');er.hidden=true;
    try{
      let txt;
      if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){er.textContent='Lecture du PDF…';er.hidden=false;er.style.color='var(--ink-2)';txt=await pdfToText(f);er.hidden=true;er.style.color=''}
      else txt=await f.text();
      txt=cleanText(txt);
      if(txt.length<50)throw new Error('vide');
      const ta=document.getElementById('imp-text');ta.value=(ta.value?ta.value+'\n\n':'')+txt;
      ta.dispatchEvent(new Event('input',{bubbles:true}));
      const ti=document.getElementById('imp-title');if(!ti.value)ti.value=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');
    }catch(x){er.style.color='';er.textContent="Impossible de lire ce fichier (un PDF scanné n'a pas de texte). Colle plutôt le texte du cours.";er.hidden=false}
    t.value='';
  }
  else if(t.dataset&&t.dataset.i==='cftype'){V.edit.draft=readCardForm();V.edit.draft.type=t.value;render()}
  else if(t.name==='cfl'){applyCardFilter()}
  else if(t.dataset&&t.dataset.i==='thm'){try{localStorage.setItem('mnemo.theme',t.value)}catch(x){}applyTheme()}
  else if(t.dataset&&t.dataset.i==='gk'){setAI(Object.assign({},getAI(),{key:t.value.trim()}));toast('Clé enregistrée sur cet appareil.')}
  else if(t.dataset&&t.dataset.i==='gm'){setAI(Object.assign({},getAI(),{model:t.value.trim()||'gemini-2.5-flash'}));toast('Modèle enregistré.')}
  else if(t.dataset&&t.dataset.i==='npd'){settings().newPerDay=Number(t.value);touch('settings');toast('Enregistré.')}
  else if(t.id==='bk-file'&&t.files&&t.files[0]){const f=t.files[0];importBackup(await f.text());t.value=''}
});

document.addEventListener('keydown',e=>{
  if(V.name!=='quiz'||!Q||e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='textarea'||tag==='input'||tag==='select')return;
  const item=curItem();if(!item)return;const k=getCard(item.cid,item.kid);
  const isSpace=e.key===' '||e.key==='Enter';
  if(Q.stage==='ask'){
    if(k.type==='qcm'&&/^[1-4]$/.test(e.key)&&Number(e.key)-1<k.choices.length){quizPick(Number(e.key)-1);e.preventDefault()}
    else if(k.type==='vf'&&(e.key==='1'||e.key==='2')){quizPick(e.key==='1'?1:0);e.preventDefault()}
    else if((k.type==='flash'||k.type==='open')&&isSpace){quizReveal();e.preventDefault()}
  }else if(Q.stage==='reveal'){
    if(k.type==='qcm'||k.type==='vf'){if(isSpace){quizRate(Q.picked===k.answer?2:0);e.preventDefault()}}
    else if(/^[1-4]$/.test(e.key)){quizRate(Number(e.key)-1);e.preventDefault()}
  }
});
